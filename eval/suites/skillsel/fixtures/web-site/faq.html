<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FAQ - Tidewater</title>
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/faq.js" defer></script>
</head>
<body>
<div class="page">
  <h1>Questions</h1>
  <div class="faq">
    <button class="question">Does it work offline?</button>
    <div class="answer">Yes. Tables for your harbours are stored on the device.</div>
    <button class="question">Which harbours are covered?</button>
    <div class="answer">Every harbour with a published tide gauge in the UK, Ireland and France.</div>
    <button class="question">Can I cancel any time?</button>
    <div class="answer">Yes, from the account page; you keep access until the end of the month.</div>
  </div>
</div>
</body>
</html>
