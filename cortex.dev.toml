# CortexCode development configuration, read by `cortex-frame --config cortex.dev.toml`.
#
# The frame runs every installed plugin package (<home>/plugins/<id>/<version>/, recorded with the
# disabled ones in <home>/state/plugins.json); nothing is loaded from plugin folders. Install with
# `cortex-pack build plugins/<name> --install` (or `cx plugin install <file.ccplugin>`); `./cortexcode`
# installs every repository plugin that is missing on its first start.
#
# Schema (the frame rejects unknown keys):
#   [frame]
#   home = "~/.cortexcode"          # CORTEX_HOME unless the env var overrides it
#   port = 0                         # 0 = pick a free port (written to <home>/run/frame.json)
#   ui = true                        # spawn the Electron shell after plugins are active
#   ui_dir = "ui"                    # Electron app directory (relative to this file)
#   code = "~/.cortexcode/code"      # the code folder: CortexCode's own source, where plugins read
#                                    # their live data (default <home>/code; `--safe` ignores it)
#
#   [plugin.<id>]                    # optional overrides of what plugin <id>'s package declares
#   args = []
#   hello_timeout_ms = 60000
#   probe_timeout_ms = 120000
#   [plugin.<id>.config]             # merged over the package's [backend.config], delivered in
#                                    # HelloAck.config (relative paths: relative to this file)

[frame]
home = "~/.cortexcode"
port = 0
ui = true
ui_dir = "ui"

[plugin.tools.config]
cx_path = "cli/target/release/cx"
pack_path = "packer/target/release/cortex-pack"

# The code folder is created from this repository (the "shipped source" a packaged app carries) and
# updated from it at every start; approved code changes are built with this packer.
[plugin.source-manager.config]
shipped_source = "."
packer = "packer/target/release/cortex-pack"
