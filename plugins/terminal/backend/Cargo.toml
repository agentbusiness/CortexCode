[package]
name = "cc-terminal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode terminal@1 plugin: PTY terminals running the user's login shell, with output events and VT-parsed screen snapshots."

# Own workspace: every plugin directory builds independently.
[workspace]

[lib]
name = "cc_terminal"
path = "src/lib.rs"

[[bin]]
name = "cc-terminal"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
portable-pty = "0.9"
vt100 = "0.16"
base64 = "0.22"
libc = "0.2"
uuid = { version = "1.23", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["process", "net"] }
