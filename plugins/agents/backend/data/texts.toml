# Every short model-facing text of cc-agents. `{name}` is filled in by the host; each text must keep
# exactly the placeholders it is shipped with (checked on load).

host_prefix = "[host]"
stage = "Current stage: {stage}."
stage_live = "Current stage: {stage}.\n{live}"

# ---- planning ----------------------------------------------------------------------------------
request = "Goal: {goal}\n\nWhat the conversation established:\n{context}\n\nGraph context for the goal:\n{graph}"
no_context = "(nothing beyond the goal)"
plan_unreadable = "Your previous plan could not be read ({error}). Write only the JSON object."
plan_unusable = "Your previous plan cannot be used: {problems}. Write the corrected plan."
overlaps = "These tasks would run at the same time but affect the same code, so their changes would collide. Make one depend on the other, merge them, or cut them along a different line:"
overlap = "\n- \"{a}\" and \"{b}\": {shared}"
graph_related = "Code related to the goal:\n{text}"
graph_impact = "What depends on that code:\n{text}"
graph_unavailable = "(the code graph is unavailable)"
verifiers_candidates = "This project's own check commands (`checks` picks among them; none when none tests the task):\n{list}"
verifier_line = "- {kind}: `{command}`"

# ---- contract review (the planner judging a worker's proposed revision) ------------------------
review_request = "Task: {title}\n\n{brief}\n\nThe checks in force (frozen when the task was claimed):\n{old}\n\nThe checks {worker} proposes instead:\n{new}\n\nWhat the proposal rests on:\n{evidence}"
review_check = "\n- `{command}`"
review_unreadable = "Your previous decision could not be read ({error}). Write only the JSON object."
review_refused_check = "The proposal was refused without review: a proposed check {why}."
review_refused_empty = "The proposal was refused without review: it leaves no check the host can run."
review_refused_unchanged = "The proposal is the contract already in force."
review_no_decision = "The planner gave no readable decision, so the contract in force stands."

# ---- merge steward (sent to the agent) -----------------------------------------------------------
merge_conflict = "Merging your branch into the project conflicts in: {files}. {pulled} Resolve every conflict so both sides' intent is kept, run the contract again, then finish with a summary."
merge_blocked_by_local = "The agent's work is ready, but merging it would change files that have edits you have not committed: {files}. Commit those edits, then merge again (nothing was changed)."
pulled_clean = "The project's latest changes merged into your workspace cleanly; check the result."
pulled_conflicts = "The project's latest changes were merged into your workspace and left conflict markers in those files."
pull_failed = "Merging the project's changes into your workspace failed ({error})."
branch_unknown = "The project's branch could not be read."
restart_followup = "Your run on this task ended before the task was done. Continue the task from where the work above stopped."

# ---- board posts (read by other agents) ----------------------------------------------------------
board_claim = "Working on \"{title}\".{touches}"
board_touches = " Touches: {touches}."
board_error = "Stopped by an error: {error}"
board_run_ended = "Run ended: {outcome}."
board_restart = "Working on \"{title}\" again."
board_done = "Done: {title}. {summary}{changed}"
board_changed = " Changed: {files}."
board_removed = " Removed (no longer in the project): {files}."
board_cancelled = "Stopped: \"{title}\" was cancelled; do not wait for it."
finished_by_session = "The session took the work as done as it stands."
board_failing = "{title}: the work is in the project, but its contract fails there."
board_conflict = "{title}: merge conflict in {files}; handed back to {agent}"
board_blocked_by_local = "{title}: {agent}'s work is ready; the merge waits for uncommitted edits in {files} to be committed."

# ---- progress (the delegating session's journal, shown on its card) -------------------------------
# What checked a finished task is said as what it is: a task no check ran on is never told as a
# pass (seen: nine tasks with no check, each told as "its checks pass in the project").
progress_done = "{agent} finished \"{title}\": {checked} {changed}\nIts report:\n{summary}"
progress_verified = "its checks pass in the project."
progress_unchecked = "no check ran on it, so nothing shows yet that it works."
progress_unrun = "its checks could not run here (the machine killed them, e.g. for memory), so nothing shows yet that it works."
progress_known_failures = "its checks still fail, only where they failed before the work or outside its files; the plan's last task makes them pass."
progress_changed_none = "It changed no file."
progress_cancelled = "\"{title}\" was cancelled{agent}."
progress_cancelled_agent = " ({agent} stopped)"
progress_restarted = "{agent} works on \"{title}\" again."

# ---- what checked a task (task records, merge results, the finished tree) --------------------------
result_verified = "verified in the project: {summary}"
result_unchecked = "done; no check ran on it: {summary}"
result_unrun = "done; its checks could not run here: {summary}"
result_known_failures = "done; its checks still fail where they failed before or outside its files: {summary}"
verify_unchecked = "no check ran on it in {workspace}: its contract holds none"
merge_verified = "verified in the project"
merge_unchecked = "in the project; no check ran on it"
merge_unrun = "in the project; its checks could not run here"
merge_known_failures = "in the project; its checks still fail where they failed before or outside its files"
merge_failing = "the contract fails in the project"
# The finished tree, for the session that judges it against what the user asked: the counts, then
# one line per task.
tree_done = "Every task is done: {passed} of {total} with passing checks, {unchecked} with no check run on it, {failing} with checks that still fail."
tree_task = "- \"{title}\"{agent}: {state}."
tree_task_agent = " ({agent})"
tree_task_passed = "its checks pass in the project"
tree_task_unchecked = "no check ran on it"
tree_task_failing = "its checks still fail in the project"

# ---- frontier workers (Claude Code, Codex; docs/FRONTIER-AGENTS.md) -------------------------------
# The task as the worker reads it; the step to take is last.
frontier_task = "Your task: {title}\n\n{brief}"
frontier_plan = "\n\nThe planner's steps:\n{plan}"
frontier_touches = "\n\nThe code this task claims: {touches}."
frontier_checks = "\n\nIt is done when these pass from the project root:{checks}"
frontier_go = "\n\nStart with the code the task names: read it with the cortex tools, then make the change."
# The project's own rules, first in a new CLI session's first message (the CLI runs outside the
# project's folder, so it does not find them itself); the task follows, last.
frontier_contract = "The project's own rules (its AGENTS.md):\n\n{contract}"
# A CLI session that takes a task over from a session on another computer.
frontier_moved = "An earlier run worked on this task and its conversation is not here. What it changed is in the project's files: read them before you go on."
# In the agent's journal while its CLI waits for a free place on the computer that runs it.
frontier_queued = "Waiting for a free {worker} place on {computer} ({ahead} ahead)."
frontier_failed = "The worker's run failed: {error}"
frontier_cancelled = "The worker's run was stopped."
frontier_no_report = "The worker ended without its report."
# Said to the lead (its journal) and on the board.
progress_waiting = "{agent} asks about \"{title}\": {question}\nAnswer it to {agent} (steer): the answer is its next message."
progress_worker_fallback = "{agent} works on \"{title}\" with the local model: {reason}"
board_waiting = "Waiting for the lead on \"{title}\": {question}"
frontier_no_plan = "The planning agent ended without a plan."
# The planning agent's first message: what to plan, then what the lead knows; the step is last.
frontier_plan_request = "Plan this work:\n{goal}\n\nWhat the lead knows for the plan:\n{context}\n\nRead what the work touches, then answer with the plan."
frontier_plan_title = "Plan: {goal}"
# Progress the lead hears while frontier agents work.
progress_planning = "{agent} plans \"{goal}\" (a frontier agent: it reads, changes nothing, and answers with the plan)."
progress_said = "{agent} on \"{title}\": {text}"
# A frontier agent that will not do its task: a local agent takes it.
board_declined = "{worker} declined \"{title}\" ({reason}); a local agent takes it."
progress_declined = "{agent} ({worker}) declined \"{title}\": {reason}\n{local} takes the task with the local model and all of its tools."
# An agent's task moved to another worker (the lead's `local`/`frontier`, agents.agent.worker).
board_moved = "\"{title}\" moves from {from} to {to}: {agent} stopped, {new} takes it."
progress_moved = "{agent} ({from}) stopped; {new} takes \"{title}\" with {to}, from what is in the files."
# The app's work paused (the header's Pause): a frontier agent stopped after its last tool call.
frontier_paused = "Paused after the last finished step; it goes on after Resume."
frontier_resume = "The work was paused and is resumed now. Check where you left off (the files you changed, your last steps above) and continue the task from there."
