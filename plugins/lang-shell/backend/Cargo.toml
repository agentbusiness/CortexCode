[package]
name = "cc-lang-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode lang@1 plugin for shell scripts: the code graph's facts of sh/bash/zsh scripts, bash-language-server with ShellCheck diagnostics/definition/references/hover, shellcheck / bash -n verifiers and shell skills."

# Own workspace: every plugin directory builds independently.
[workspace]

[lib]
name = "cc_lang_shell"
path = "src/lib.rs"

[[bin]]
name = "cc-lang-shell"
path = "src/main.rs"

[dependencies]
cc-lang-kit = { path = "../../../lang-kit" }
tree-sitter-bash = "0.25"
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
# A release archive shaped like ShellCheck's, for the installer test.
tar = "0.4.46"
flate2 = "1.1"
