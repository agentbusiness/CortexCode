[package]
name = "uzu-engine"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
build = "build/main.rs"

[lints]
workspace = true

[features]
default = ["cpu", "metal", "grammar"]

cpu = [] # TODO: move libm here

metal = [
    "dep:rayon",
    "dep:clang-ast",
    "dep:depfile",
    "dep:tempfile",
    "dep:serde_json",
    "dep:objc2",
    "dep:obfstr",
    "dep:blake3",
    "dep:xxhash-rust",
    "dep:metal",
]

grammar = ["dep:xgrammar", "dep:schemars", "dep:llguidance", "dep:toktrie_hf_tokenizers"]

[build-dependencies]
anyhow.workspace = true
walkdir.workspace = true
derive_more.workspace = true
serde.workspace = true
quote.workspace = true
proc-macro2.workspace = true
syn.workspace = true
prettyplease.workspace = true
itertools.workspace = true
rhai.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.build-dependencies]
rayon = { workspace = true, optional = true }
clang-ast = { workspace = true, optional = true }
depfile = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["unbounded_depth"], optional = true }
blake3 = { workspace = true, optional = true }
xxhash-rust = { workspace = true, features = ["xxh3"], optional = true }

[dependencies]
uzu-engine-macros.workspace = true
bitflags.workspace = true
derive_more = { workspace = true, features = ["debug"] }
shoji.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
monostate.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
rangemap.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
num-traits.workspace = true
libm.workspace = true
itertools.workspace = true
parking_lot.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = { workspace = true, optional = true }
obfstr = { workspace = true, optional = true }
xxhash-rust = { workspace = true, features = ["xxh3"], optional = true }
metal = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xgrammar = { workspace = true, optional = true }
llguidance = { workspace = true, optional = true }
toktrie_hf_tokenizers = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
