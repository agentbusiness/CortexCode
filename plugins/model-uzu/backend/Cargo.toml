[package]
name = "cc-model-uzu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false
description = "CortexCode model plugin (model@1) on Mirai's uzu engine (Rust, Metal, M5 matrix units, speculative decoding), embedded in-process."

# Standalone workspace: the plugin builds on its own. The vendored uzu tree is its own workspace.
[workspace]
exclude = ["vendor/uzu"]

[[bin]]
name = "cc-model-uzu"
path = "src/main.rs"

[lib]
name = "cc_model_uzu"
path = "src/lib.rs"

[features]
default = ["metal"]
# Production backend: uzu's Metal kernels (needs the Xcode Metal toolchain at build time).
metal = ["uzu-engine/metal"]
# uzu's reference CPU backend (development builds without the Metal toolchain; far too slow for use).
cpu = ["uzu-engine/cpu"]

[dependencies]
cc-protocol = { path = "../../../protocol" }
uzu-engine = { path = "vendor/uzu/crates/uzu-engine", default-features = false, features = ["grammar"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2.17.0", features = ["json", "preserve_order", "loop_controls"] }
minijinja-contrib = { version = "2.17.0", features = ["pycompat"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
libc = "0.2.182"
uuid = { version = "1.23", features = ["v4"] }
parking_lot = "0.12"
metal = { package = "mtl-rs", version = "0.2.2" }
# Image understanding (vendor patch P7): decoding PNG/JPEG/WebP/GIF/BMP and resizing on the CPU.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
half = { version = "2.7", features = ["bytemuck"] }
base64 = "0.22"

[dev-dependencies]
xgrammar = { package = "xgrammar-rs", version = "0.2.8", features = ["tokenizers"] }
llguidance = { version = "1.9.1", default-features = false, features = ["lark"] }
toktrie = "1.9.1"
toktrie_hf_tokenizers = "1.9.1"

[profile.release]
debug = false
lto = "thin"
