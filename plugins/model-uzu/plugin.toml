# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# UI packages, verification and README together, separable into its own repository (only
# cc-protocol and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it into a
# portable .ccplugin; the frame runs it only as an installed package. Paths are
# relative to this folder.

[plugin]
id = "model-uzu"
name = "Model (uzu)"
version = "0.1.13"
description = "Qwen3.8-27B (Mirai M, 4-bit) in-process on uzu's Metal engine: lossless speculative decoding, grammar-constrained tool calls, per-conversation KV cache, hibernate, and a local OpenAI-compatible endpoint."
license = "UNLICENSED"
platforms = ["macos"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace,
# vendored uzu under backend/vendor; backend/.cargo/config.toml and backend/rust-toolchain.toml hold
# this plugin's Xcode Metal toolchain and Rust pin). Loading the 27B model takes minutes on a cold
# disk cache, hence the long probe.
[backend]
category = "model"
contract = "model@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-model-uzu"
hello_timeout_ms = 60000
probe_timeout_ms = 600000

[backend.config]
variant = "qwen3.8-27b-m"

# The machines this engine is the default for (the frame picks it when the person chose none):
# above 24 GiB. Smaller Macs default to model-bonsai.
[backend.machine]
min_memory_bytes = 25769803777

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

[[ui.package]]
dir = "ui/card-model"
id = "model-uzu.card-model"
slot = "card.model@1"

[[ui.package]]
dir = "ui/settings-model"
id = "model-uzu.settings-model"
slot = "settings.model@1"
