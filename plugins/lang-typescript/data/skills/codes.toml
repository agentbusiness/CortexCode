  "2307", "TS2307", "2305", "TS2305", "2614", "TS2614", "1192", "TS1192", "2554", "TS2554", "18048",
  "TS18048", "18047", "TS18047", "2532", "TS2532", "2366", "TS2366", "2355", "TS2355", "7030", "TS7030",
  "2835", "TS2835", "ERR_MODULE_NOT_FOUND", "ERR_REQUIRE_ESM", "ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX",
