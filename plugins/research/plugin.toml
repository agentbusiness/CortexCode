# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# verification and README together, separable into its own repository (only cc-protocol comes from
# outside). `cortex-pack` builds the folder and packs it into a portable .ccplugin; the frame runs it only as an installed package. Paths are relative to this folder.

[plugin]
id = "research"
name = "Research"
version = "0.1.0"
description = "Research that needs the world, online only when a network exists: search arXiv, Semantic Scholar, GitHub (through gh when signed in), Reddit, Hacker News and the web (DuckDuckGo's HTML page, the built-in browser when blocked); fetch pages (readability) and PDFs as clean text with a content cache; cited notes by topic, kept by the memory plugin in IronGraph's knowledge layer (global, searchable by meaning); deep research as a background map-reduce job with the local model that writes docs/research/<topic>.md. No cloud models, no paid APIs, no keys required; offline is reported plainly."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
[backend]
category = "research"
contract = "research@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-research"
provides = [
  "research.search", "research.fetch", "research.note.add", "research.note.search", "research.notes",
  "research.deep", "research.job.status", "research.job.cancel", "research.jobs", "research.sources",
]
publishes = ["research.progress", "research.job"]
uses = ["model.chat", "frame.project.get", "browser.open", "browser.eval", "browser.close", "memory.note.add", "memory.note.search", "memory.note.list"]

# Defaults for the frame config's [plugin.config] table (the frame config's values win).
[backend.config]
timeout_ms = 20000                 # per HTTP request
max_download_bytes = 26214400      # per fetch (25 MB); a larger PDF is refused with this name
max_text_chars = 400000            # extracted text kept per document
cache_ttl_hours = 168              # $CORTEX_HOME/research/cache entries are fresh this long
allow_private_hosts = false        # research.fetch never reads loopback / private / link-local addresses
web_search = "auto"                # auto (DuckDuckGo HTML, then the built-in browser when blocked) | http | browser
github = "auto"                    # auto (gh when installed and signed in, else REST) | gh | rest
gh = "gh"                          # the GitHub CLI
arxiv_interval_ms = 3000           # arXiv's API terms: one request every 3 s
max_retry_wait_ms = 5000           # a 429/503 is retried when the server asks to wait at most this long
deep_depth = 2                     # rounds of search -> read -> synthesize -> gap check
deep_sources_per_round = 8
deep_results_per_query = 4
chunk_chars = 12000                # characters of a source per model call (map); fits a 32k context
max_chunks_per_source = 6
synth_chars = 48000                # characters of notes per synthesis call (reduce)
model_max_tokens = 2048
model_priority = "agent"           # foreground | agent | background
# user_agent = "CortexCode-research/0.1 (local research assistant; macOS)"
# Endpoints (mirrors, tests): arxiv_api, semantic_scholar_api, github_api, reddit, hackernews_api, duckduckgo_html

# What building this plugin's code needs on a Mac: code editing is offered only when all of it
# is present (data editing always is).
[build]
needs = ["rust", "apple-clt"]

# Where the source lives, for the source manager (self-rewrite) and for `cortex-pack --source`.
[source]
repo = "cortexcode"
subdir = "plugins/research"
