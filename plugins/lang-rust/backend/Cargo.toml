[package]
name = "cc-lang-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode lang@1 plugin for Rust: the code graph's facts of .rs files and Cargo.toml, rust-analyzer diagnostics/definition/references/hover, cargo verifiers and Rust skills."

# Own workspace: every plugin directory builds independently.
[workspace]

[lib]
name = "cc_lang_rust"
path = "src/lib.rs"

[[bin]]
name = "cc-lang-rust"
path = "src/main.rs"

[dependencies]
cc-lang-kit = { path = "../../../lang-kit" }
tree-sitter-rust = "0.24"
toml = "1.1"
serde_json = "1.0.149"
semver = "1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
