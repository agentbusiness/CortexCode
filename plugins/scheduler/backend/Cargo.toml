[package]
name = "cc-scheduler"
description = "CortexCode scheduler (schedule@1): routines, recurring and timed work that wakes a session, hands a brief to an agent or runs a command."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false

# A self-contained plugin: its own workspace, depending only on the protocol.
[workspace]

[lib]
name = "cc_scheduler"
path = "src/lib.rs"

[[bin]]
name = "cc-scheduler"
path = "src/bin/cc-scheduler.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["agents", "host", "memory", "schedule", "tools"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.23", features = ["v4"] }

[profile.release]
debug = 1
