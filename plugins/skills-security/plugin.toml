# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, UI package and README together, separable into its own repository (only cc-protocol,
# cc-lang-kit and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it into
# a portable .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "skills-security"
name = "Security skills"
version = "0.1.7"
description = "Security know-how for the model: a whole-codebase security audit (map the stack, hunt each attack class, verify, record and report), a security review of a change, and the triage of a reported vulnerability; with the bundled secaudit tool that maps the project, lists suspicious lines by attack class, checks finding records and writes the report."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
# One skills plugin per body of know-how: the `skills` family, category `skills-<id>`, contract
# `skills@1`. `data/` (the skills and the secaudit tool) is the plugin's data (`[data]`).
[backend]
category = "skills-security"
contract = "skills@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-skills-security"

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

# The Security tab of the right pane: the findings the memory plugin keeps (`memory.security.*`).
[[ui.package]]
dir = "ui/security"
id = "skills-security.pane"
slot = "pane.security@1"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/skills-security/data).
[data]
dirs = ["data"]
