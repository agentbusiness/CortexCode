# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, UI package and README together, separable into its own repository (only cc-protocol,
# cc-lang-kit and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it into
# a portable .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "skills-security"
name = "Security skills"
version = "0.1.22"
description = "Security know-how for the model (a whole-codebase audit, a review of a change, the triage of a reported vulnerability, a fix) with the bundled secaudit tool; and the security sentinel: every project of this computer swept for new advisories every few minutes and for supply-chain, CI, AI-agent-file and credential signals daily, each finding judged by host rules and the local model, only real alerts shown in colour and told, the rest kept grey."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
# One skills plugin per body of know-how: the `skills` family, category `skills-<id>`, contract
# `skills@1`. `data/` (the skills and the secaudit tool) is the plugin's data (`[data]`).
[backend]
category = "skills-security"
contract = "skills@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-skills-security"
subscribes = ["memory.security.changed", "memory.settings.changed"]
publishes = ["skills.changed", "skills-security.progress", "skills-security.changed"]
# Calls it makes: the findings and its own records (memory), the filter's judgment (model), what it
# tells (notify), the investigation sessions (frame, chat flow) and the old watch routines (schedule).
uses = [
  "memory.project.list", "memory.security.findings", "memory.security.finding", "memory.security.findings.put", "memory.security.finding.update",
  "memory.security.recheck", "memory.security.summary", "memory.security.triage.put", "memory.settings.list", "memory.graph.machine",
  "memory.graph.put", "memory.graph.query", "memory.graph.retire", "model.chat", "notify.send", "frame.session.create", "chatflow-coding.turn",
  "schedule.list", "schedule.remove",
]

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

# The Security tab of the right pane: the findings the memory plugin keeps (`memory.security.*`).
[[ui.package]]
dir = "ui/security"
id = "skills-security.pane"
slot = "pane.security@1"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/skills-security/data).
[data]
dirs = ["data"]

# The sentinel's settings, in the main settings database (memory.settings, section `security`). All
# have defaults; none is needed.
[settings]
section = "security"
keys = [
  "security.investigate (boolean, default true): what the fast filter cannot settle is investigated by a session",
  "security.validate_secrets (boolean, default false): ask each credential's own provider whether it is live",
  "security.notify (alerts | urgent | off, default alerts): urgent alerts at once and a daily digest of the rest",
  "security.delta_minutes (number, default 15)", "security.full_hours (number, default 24)",
]
