# The projects each skill can help in: a skill not listed applies to every project. `done`: the
# command whose exit status says whether the skill's work is finished (0 finished; otherwise its
# output says what is left and ends with the next step), so a turn does not end on a progress note.

[security-audit]
done = "python3 \"$CORTEX_HOME/code/plugins/skills-security/data/scripts/secaudit.py\" status"
# The units agents can take at the same time (one per attack class), and when one unit is done.
units = "python3 \"$CORTEX_HOME/code/plugins/skills-security/data/scripts/secaudit.py\" units"
unit_done = "python3 \"$CORTEX_HOME/code/plugins/skills-security/data/scripts/secaudit.py\" status --unit {unit}"

[security-fix]
done = "python3 \"$CORTEX_HOME/code/plugins/skills-security/data/scripts/secaudit.py\" status --fixing"
