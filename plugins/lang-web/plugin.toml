# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, verification and README together, separable into its own repository (only cc-protocol and
# cc-lang-kit come from outside). `cortex-pack` builds the folder and packs it into a portable
# .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "lang-web"
name = "Web (HTML, CSS)"
version = "0.1.7"
description = "Everything CortexCode knows about HTML and CSS (SCSS, Less): the code graph's facts of pages and stylesheets, vscode-html-language-server and vscode-css-language-server diagnostics, definition, references and hover, the project's html-validate / stylelint as verifiers and web skills."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
# One language plugin per language: the `lang` family, category `lang-<id>`, contract `lang@1`.
# `data/` (the skills) is the plugin's data (`[data]`). The same executable, run as
# `cc-lang-web lsp-router`, is the language server the kit starts per workspace: it routes pages
# to vscode-html-language-server and stylesheets to vscode-css-language-server.
[backend]
category = "lang-web"
contract = "lang@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-lang-web"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/lang-web/data).
[data]
dirs = ["data"]
