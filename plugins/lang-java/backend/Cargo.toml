[package]
name = "cc-lang-java"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode lang@1 plugin for Java: the code graph's facts of .java files, pom.xml and build.gradle(.kts), Eclipse JDT LS diagnostics/definition/references/hover, Gradle / Maven verifiers and Java skills."

# Own workspace: every plugin directory builds independently.
[workspace]

[lib]
name = "cc_lang_java"
path = "src/lib.rs"

[[bin]]
name = "cc-lang-java"
path = "src/main.rs"

[dependencies]
cc-lang-kit = { path = "../../../lang-kit" }
tree-sitter-java = "0.23.5"
serde_json = "1.0.149"
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
