# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, verification and README together, separable into its own repository (only cc-protocol and
# cc-lang-kit come from outside). `cortex-pack` builds the folder and packs it into a portable
# .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "lang-java"
name = "Java"
version = "0.1.8"
description = "Everything CortexCode knows about Java: the code graph's facts of .java files, pom.xml and build.gradle(.kts), Eclipse JDT LS diagnostics, definition, references and hover (on a JDK 21 installed into the toolchains directory when the system has none), Gradle / Maven verifiers and Java skills."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
# One language plugin per language: the `lang` family, category `lang-<id>`, contract `lang@1`.
# `data/` (the skills) is the plugin's data (`[data]`). jdtls runs on the picked JDK's java, started per
# workspace with that workspace's -data directory (the pack's server_launch); `[plugin.config]
# server_path` names another server executable (a jdtls script, given `-data <dir>`).
[backend]
category = "lang-java"
contract = "lang@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-lang-java"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/lang-java/data).
[data]
dirs = ["data"]
