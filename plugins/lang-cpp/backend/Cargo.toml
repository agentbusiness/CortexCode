[package]
name = "cc-lang-cpp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode lang@1 plugin for C/C++: the code graph's facts of C and C++ files and CMakeLists.txt, clangd diagnostics/definition/references/hover, CMake / ctest / make verifiers and C/C++ skills."

# Own workspace: every plugin directory builds independently.
[workspace]

[lib]
name = "cc_lang_cpp"
path = "src/lib.rs"

[[bin]]
name = "cc-lang-cpp"
path = "src/main.rs"

[dependencies]
cc-lang-kit = { path = "../../../lang-kit" }
tree-sitter-cpp = "0.23.4"
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
