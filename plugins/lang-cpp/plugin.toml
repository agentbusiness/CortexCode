# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, verification and README together, separable into its own repository (only cc-protocol and
# cc-lang-kit come from outside). `cortex-pack` builds the folder and packs it into a portable
# .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "lang-cpp"
name = "C/C++"
version = "0.1.2"
description = "Everything CortexCode knows about C and C++: the code graph's facts of C/C++ sources and headers and CMakeLists.txt, clangd diagnostics, definition, references and hover (pointed at the workspace's compile_commands.json), CMake / ctest / make verifiers and C/C++ skills."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
# One language plugin per language: the `lang` family, category `lang-<id>`, contract `lang@1`.
# `data/` (the skills) is the plugin's data (`[data]`). clangd starts per workspace pointed at its
# compile_commands.json (the pack's server_launch); `[plugin.config] server_path` names another
# clangd executable.
[backend]
category = "lang-cpp"
contract = "lang@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-lang-cpp"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/lang-cpp/data).
[data]
dirs = ["data"]
