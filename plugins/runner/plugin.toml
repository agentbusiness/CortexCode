# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data and README together, separable into its own repository (only cc-protocol comes from
# outside). `cortex-pack` builds the folder and packs it into a portable .ccplugin; the frame runs
# it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "runner"
name = "Runner"
version = "0.1.6"
description = "Builds for a manager (CortexManage): a job is a worktree of the source's mirror, a finished plan carried out by the chat flow, a commit after each task, the facts of the run every 20 s, a build into the proving home, and the landing on the main branch. No window."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
[backend]
category = "runner"
contract = "runner@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-runner"

# The plugin's data (texts): packed at the same path; the app reads and edits it live in the live
# folder (<home>/live/plugins/runner/backend/data).
[data]
dirs = ["backend/data"]
