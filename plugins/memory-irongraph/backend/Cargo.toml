[package]
name = "cc-memory"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode memory plugin (memory@1): IronGraph code graph, line store and persistent work state."

# Standalone workspace: every plugin is its own workspace.
[workspace]

[[bin]]
name = "cc-memory"
path = "src/main.rs"

[lib]
name = "cc_memory"
path = "src/lib.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["hashline", "lang", "memory", "model", "skills"] }
# Its own skills (data/skills, the skills format of the language and skills plugins).
cc-lang-kit = { path = "../../../lang-kit" }
irongraph-sdk = "=0.1.13"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ignore = "0.4.33"
notify = "8"
rayon = "1.12"
blake3 = "1.8"
uuid = { version = "1.23", features = ["v4"] }
# Embedding-model installation (resumable HTTPS range download, pinned-digest verification).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
sha2 = "0.10"
sha1 = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IronGraph's static library carries BLAKE3's C functions; GNU ld refuses a second copy of them,
# so on Linux this crate's BLAKE3 is the pure Rust one (macOS's linker takes the first copy).
[target.'cfg(target_os = "linux")'.dependencies]
blake3 = { version = "1.8", features = ["pure"] }

[dev-dependencies]
tempfile = "3.27"
# The language plugins, served in-process to the tests by an in-test frame peer (tests/common): the
# code graph's facts in the tests are the real plugins' (`<category>.extract`, `describe`).
cc-lang-rust = { path = "../../lang-rust/backend" }
cc-lang-python = { path = "../../lang-python/backend" }
cc-lang-typescript = { path = "../../lang-typescript/backend" }
cc-lang-shell = { path = "../../lang-shell/backend" }
cc-lang-go = { path = "../../lang-go/backend" }
cc-lang-java = { path = "../../lang-java/backend" }
cc-lang-cpp = { path = "../../lang-cpp/backend" }
cc-lang-docker = { path = "../../lang-docker/backend" }
cc-lang-web = { path = "../../lang-web/backend" }
cc-lang-markdown = { path = "../../markdown/backend" }

[profile.release]
debug = "line-tables-only"
