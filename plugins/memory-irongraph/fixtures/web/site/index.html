<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <link rel="stylesheet" href="css/site.css">
  <style>
    :root { --accent: #f60; }
    .badge { color: var(--accent); }
    .hero { border-color: var(--brand); animation: spin 2s; }
  </style>
</head>
<body>
  <main id="main" class="page">
    <h1>Shop</h1>

      <div id="spin">button</div>
      <label for="button">Press the button</label>
      <button id="button" class="btn">Buy</button>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
