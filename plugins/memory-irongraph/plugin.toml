# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# UI packages, shell modules, verification and README together, separable into its own repository
# (only cc-protocol and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it
# into a portable .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "memory-irongraph"
name = "Memory (IronGraph)"
version = "0.1.5"
description = "The code graph on embedded IronGraph (symbols, call sites with argument text, cross-language edges, semantic search), the line store, persistent tasks, board, agents, rules, style and the main settings database, cited notes (research findings) and project knowledge (concepts, facts, decisions, theories, questions bound to code) in the knowledge layer, searchable by meaning; the Index and Knowledge card sections; its own skill for querying the store (irongraph-queries)."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
[backend]
category = "memory"
contract = "memory@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-memory"
# Its own skills (how to query the IronGraph store), served as memory.skills / memory.skill.
probe_timeout_ms = 300000

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

[[ui.package]]
dir = "ui/card-index"
id = "memory-irongraph.card-index"
slot = "card.index@1"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/memory-irongraph/data).
[data]
dirs = ["data"]
