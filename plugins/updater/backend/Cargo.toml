[package]
name = "cc-updater"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode update@1 plugin: reads the release catalog, installs plugin releases the user did not change, asks about the ones they changed, and stages frame releases for the next start."

# Own workspace: the plugin builds (and ships) on its own.
[workspace]

[lib]
name = "cc_updater"
path = "src/lib.rs"

[[bin]]
name = "cc-updater"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["chatflow", "release", "source", "update"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
# HTTP: rustls, the system proxy; release files come from GitHub.
reqwest = { version = "0.13.5" }
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
