# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# UI packages, shell modules, verification and README together, separable into its own repository
# (only cc-protocol and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it
# into a portable .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "vcs-git"
name = "Git"
version = "0.1.6"
description = "git status, diff with hunks, log, branches, per-hunk stage/unstage/revert, commit, merge with conflict report, shadow checkpoints that never touch the user's history, push and on-demand GitHub status; the GitHub connection (device sign-in or a token, kept in the Keychain or a private file), repositories, forks, pull requests and clones; the Git card section and Settings > GitHub."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
[backend]
category = "vcs"
contract = "vcs@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-vcs"

# Defaults for the frame config's [plugin.config] table (the frame config's values win).
[backend.config]
github_client_id = ""              # the GitHub app's client id for "Connect GitHub" (device sign-in); empty: token only

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

[[ui.package]]
dir = "ui/card-git"
id = "vcs-git.card-git"
slot = "card.git@1"

[[ui.package]]
dir = "ui/settings-github"
id = "vcs-git.settings-github"
slot = "settings.github@1"
