[package]
name = "cc-lang-markdown"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode lang@1 plugin for Markdown documents: the code graph's facts of a repository's prose (README, docs/, ADRs): one Section per heading with its text, and the code symbols a section mentions."

# Own workspace: every plugin directory builds independently.
[workspace]

[lib]
name = "cc_lang_markdown"
path = "src/lib.rs"

[[bin]]
name = "cc-lang-markdown"
path = "src/main.rs"

[dependencies]
cc-lang-kit = { path = "../../../lang-kit" }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[profile.release]
debug = "line-tables-only"
