[package]
name = "cc-model-bonsai"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode model plugin (model@1): Ternary Bonsai 2 27B on PrismML's llama.cpp (Metal), embedded in-process, for Macs with 24 GB of memory or less."
build = "build.rs"
links = "bonsai_shim"

# Standalone workspace: the plugin builds on its own.
[workspace]

[[bin]]
name = "cc-model-bonsai"
path = "src/main.rs"

[lib]
name = "cc_model_bonsai"
path = "src/lib.rs"

[dependencies]
cc-protocol = { path = "../../../protocol" }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2.17.0", features = ["json", "preserve_order", "loop_controls"] }
minijinja-contrib = { version = "2.17.0", features = ["pycompat"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.23", features = ["v4"] }
llguidance = { version = "1.9.1", default-features = false, features = ["lark"] }
toktrie_hf_tokenizers = "1.9.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
libc = "0.2.182"

[build-dependencies]
cmake = "0.1.58"

[profile.release]
debug = false
lto = "thin"
