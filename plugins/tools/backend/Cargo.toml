[package]
name = "cc-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode tools plugin (tools@1): hashline read/edit, persistent shell, argument repair, URI reads, copy-on-write workspaces."

# Standalone workspace (each plugin directory is its own Cargo workspace).
[workspace]

[lib]
name = "cc_tools"
path = "src/lib.rs"

[[bin]]
name = "cc-tools"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.23", features = ["v4"] }
regex = "1.12"
libc = "0.2.183"
base64 = "0.22"
ignore = "0.4"
sha2 = "0.10"
similar = "2"
percent-encoding = "2"
tracing = "0.1.44"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-md = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
