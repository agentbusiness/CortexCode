# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# UI packages, shell modules, verification and README together, separable into its own repository
# (only cc-protocol and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it
# into a portable .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "workbench"
name = "Workbench"
version = "0.1.8"
description = "The window (the slot engine, the workbench layout and the start-up splash), the right pane host, the brand band's connection problem mark, and Settings > Appearance (the ground)."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

[[ui.package]]
dir = "ui/band-connection"
id = "workbench.band-connection"
slot = "workbench.band@1"

[[ui.package]]
dir = "ui/right-pane"
id = "workbench.right-pane"
slot = "workbench.rightPane@1"

[[ui.package]]
dir = "ui/settings-appearance"
id = "workbench.settings-appearance"
slot = "settings.appearance@1"

# The window: the page the frame serves at /ui/ (window@1). It loads every plugin's UI packages
# into their slots and serves React and @cortex/sdk to them through its import map.
[[ui.package]]
dir = "ui/window"
id = "workbench.window"
slot = "window@1"
