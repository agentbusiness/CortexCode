# CortexCode plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, verification and README together, separable into its own repository (only cc-protocol and
# cc-lang-kit come from outside). `cortex-pack` builds the folder and packs it into a portable
# .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "lang-docker"
name = "Docker"
version = "0.1.2"
description = "Everything CortexCode knows about Docker: the code graph's facts of Dockerfiles and Compose files, dockerfile-language-server and compose-language-service diagnostics, definition, references and hover, docker compose config / docker build --check / hadolint verifiers, the docker CLI on commands' PATH and Docker skills."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
# One language plugin per language: the `lang` family, category `lang-<id>`, contract `lang@1`.
# `data/` (the skills) is the plugin's data (`[data]`). The same executable, run as
# `cc-lang-docker lsp-router`, is the language server the kit starts per workspace: it routes
# Dockerfiles to docker-langserver and Compose files to docker-compose-langserver (the kit runs one
# server per workspace; see the README for why the router stays).
[backend]
category = "lang-docker"
contract = "lang@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-lang-docker"

# The plugin's data (skills): packed at the same path; the app reads and edits it live in
# the live folder (<home>/live/plugins/lang-docker/data).
[data]
dirs = ["data"]
