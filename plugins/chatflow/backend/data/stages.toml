# cc-chatflow model-facing configuration. Loaded at startup and reloaded on change; a set that
# does not validate is rejected and the previous one stays active. The copy in the code folder
# (~/.cortexcode/code/plugins/chatflow/backend/data/) is the live one: an edit there is in use
# within a second (except prompts/policy.md, which only a new build changes).
#
# Constrained stages (with a schema) run without thinking: the engine applies the grammar to the
# whole generation, so a thinking block would take the decision (measured on Qwen3.5-4B).

label = "chatflow-data 1"

# Stage rules in each role's byte-stable system prompt, in order: only what that role's calls need.
# A stage outside its role's list carries its rules in its own trailing stage message: the one-shot
# grammar stages (CHECKS, SPEC, SPEC_EDIT, PLAN, PLAN_EDIT, DECISIONS) run once per occurrence, so
# their rules cost about 100-300 uncached prefill tokens there instead of context on every call.
[protocol]
# Chat sessions: the foreground flow.
chat = ["ROUTE", "DECIDE", "REPLY", "DO", "ASK"]
# Background agents: their task loop (their CHECKS decision brings its own rules).
agent = ["TASK"]

# Sampling profiles (Qwen3.8 guidance). `auto` picks `thinking` or `plain` by the call's thinking.
[sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[sampling.plain]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
# No presence penalty: a penalty switches the model's speculative decoding off (uzu's sampler
# needs flat batches for it), measured 15 vs 34-38 tok/s on a JSON decision. JSON steps are held
# by their grammar, and free text by the flow's repetition guard.
presence_penalty = 0.0

# Short JSON decisions (ROUTE, DECIDE, CHECKS, DECISIONS, SPEC_EDIT): greedy, so the same request
# decides the same way. Measured on the 27B replaying scenario P26's exact ROUTE request (3 samples):
# with `plain` (temperature 0.7) the skill choice was java-compile-errors twice and [] once. Greedy
# keeps speculative decoding on (no penalty). The long grammar stages (SPEC, PLAN, PLAN_EDIT) and
# the prose stages keep sampling.
[sampling.decision]
temperature = 0.0
top_p = 1.0
top_k = 0
min_p = 0.0
presence_penalty = 0.0

[effort]
# When a decision named no effort.
default = "medium"
# After a failing contract or a corrective replan (high made 8k-token thoughts that redrafted code
# in the reasoning; medium is enough to rethink).
escalate = "medium"
# A plan task's loop: execution of a planned step, short thoughts, the work in tool calls.
task = "low"

[limits]
# Times the plan of a decided change is written again, per turn: a task ended badly, or REVIEW found
# the tasks still to do no longer fit (the done tasks stay; the rest is planned anew).
replans = 3
# Tool calls one plan task may make before it is stuck (0 = no limit). Off: a fixed count stopped
# tasks that were still converging; stuck is the same failure repeating (`fix_cycles`).
task_calls = 0
# Most thinking tokens per step of a plan task: execution, so the work is in tool calls and values
# come from running code (the effort's own budget, 2048 for low, left room to trace code by hand).
# 1024: little-coder runs small Qwen models at 2048; the Qwen card warns too little thinking costs
# retries. A hypothesis to measure (A/B against 2048), not a settled value.
task_think_tokens = 1024
# A plan task whose same command still fails after this many edit-and-rerun cycles is stuck too
# (debugging decays within 2-3 attempts): the tasks still to do are written again.
fix_cycles = 3
# The same error (its lines without numbers) back in this many more failing runs, with other calls
# between (edits, terminal writes, scratch files): the host says its cause is a declaration the line
# uses, not the line (an error key, so other commands, files and moved lines match).
same_error_edits = 3
# A plan task that runs this many commands once a command has failed twice, without any failing
# command turning to pass, is stuck too: traces and reruns that never land (no edit sits between
# them, so `fix_cycles` misses them). High on purpose: debugging needs a run of traces, prints and
# reruns; seen stuck: 97 calls on one case. 0 = no limit.
stall_runs = 20
# Once the task has changed a file, each step is a fix: this short budget (the full one above is
# for designing and writing the first change).
fix_think_tokens = 384
# Any other agent loop's step (a question, a follow-up). Every step has a budget: the model plugin's
# own table (4096 for medium) never applies (seen: a loop without a plan step ran 4k thoughts for
# two hours).
loop_think_tokens = 1024
# Steps whose reasoning stays in the prompt (newest first); older steps keep their answer and calls
# only, as the model's template renders earlier turns. 0 (none): the engine then resumes every step
# from the checkpoint at the end of the previous prompt and re-reads only the answer and the new
# results. With 1 the step before the newest changes every time, so the engine falls back to one
# fixed older checkpoint and the re-read grows by a step each step (seen: reused 10950 of 19156).
reasoning_steps = 0
# Host-read rounds per request, the first included (ends a read loop, never output).
read_rounds = 5
# Baseline rounds of the CHECKS decision before the checks stand.
check_rounds = 4
# Identical call with identical output this many times = a repetition (the second time: the model
# re-ran the same command and got the same failure, so it is told so at once).
repeat_at = 2
# Focused map read for a decision's `focus` (tokens) and semantic search hits per query.
focus_map_tokens = 1024
search_limit = 5
# A background agent whose tool call runs longer than this hands its model slot back: its KV is
# hibernated (model.hibernate) and restored on its next model call. 0 = never (ms).
hibernate_after_ms = 3000
# Reads per read round (follow-ups included): a decision asking for more gets the first ones and a
# note saying how many were left out.
reads_per_round = 24
# Tokens of one conversation's context kept free for the answer. Before every model call the prompt
# is counted exactly (model.count); older tool outputs are folded until it fits the rest.
answer_reserve_tokens = 8192
# Tokens one conversation may use at most, whatever the model could hold (0 = the model's window).
# The compaction shares below apply to this. Off: a 48k cap compacted a working task every minute,
# folding the model's own reads and edits away, and it rewrote its code from memory.
context_tokens = 0
# A compaction (older tool outputs folded, finished turns digested) brings the prompt down to at
# most this many tokens; one that cannot reach it is not made. A fixed size: what the model works
# from stays small whatever the window holds (shares of a 230k window let a turn grow to 220k, each
# compaction saving 2k and costing a 15-minute re-read).
compact_target_tokens = 24576
# At a wait (the run's tools executing) a prompt past this many tokens is compacted then, and the
# compacted prompt is prefilled in the background (model.prewarm). 0 = only when a prompt no longer
# fits.
compact_early_tokens = 49152
# When a turn ends (the user reads the answer, the model is idle) a prompt past this many tokens is
# compacted then, so the next turn starts with room. 0 = only at the early size.
compact_idle_tokens = 32768
# Steps of an agent loop between settles: a settle applies the in-place rewrites (outdated reads,
# earlier edit echoes, outputs of a command run again) up to the newest entry; between settles the
# prompt only grows and the engine continues its state. 0 = only at compactions.
settle_steps = 8
# A settle is made only when it shrinks the prompt by at least this many tokens (it costs one re-read
# of the history after the system block; seen: 12k re-read for about 1k saved).
settle_min_tokens = 3072
# Steps of the running turn a compaction keeps whole (the newest). When folding older outputs does
# not bring a long turn under its target, its older steps become one note listing their calls.
history_tail_steps = 8
# Skills the turn's first decision may choose for its work (ROUTE's `skills`, and each PLAN task's,
# an enum of the session's catalog). 0 = no choice field: the model reads skills only on its own
# (baseline).
skills_per_turn = 3
# The skills catalog (one line per skill) sits in a chat session's system message, in the session's
# order, so it is read once per session and stays in the model's cache (prewarmed with the
# conversation) instead of being re-read after every new message (about 2.5k tokens per ROUTE on a
# four-language project). false: shown in the trailing message of the stages that choose (ROUTE,
# PLAN, PLAN_EDIT), the previous turn's skills first. Either way ROUTE's message names the previous
# turn's skills.
skills_in_prefix = true
# A user message whose text is longer than this (characters) becomes the session's spec when the
# session has none yet. 0 = only when the user marks it or the router asks for one. Off: a long
# message is often a pasted log or stack trace, not a list of requirements.
spec_min_chars = 0
# Spec text pinned whole at most (characters): pasted text beyond it is referenced by its path.
spec_max_chars = 24000
# Tasks one plan may hold (the `depends_on` numbers its grammar offers).
plan_max_tasks = 12
# Decisions one DECISIONS stage may propose.
decisions_per_turn = 3
# Knowledge items one KNOWLEDGE stage may propose from the user's message (docs/PROJECT-KNOWLEDGE-PLAN.md P3).
knowledge_items_per_turn = 3
# Knowledge items the host reads by meaning for a turn (ROUTE's `work`; 0 = none) and shows as one
# host note after the skills (P4).
knowledge_per_turn = 5
# The project's knowledge brief in the byte-stable system prompt (tokens; 0 = none) (P4).
brief_tokens = 1024
# Lessons (global, learned from earlier runs) shown with that note, best first; 0 = none.
lessons_per_turn = 4
# Lessons learned from a failure (found by its key: the refusal's tool and kind, or the shape of the
# first error line) shown right under that failure when it comes again; one, so what the run does
# next is credited to it alone.
lessons_per_failure = 1
# Episodes (a failure and what came after it) one run is learned from, at most.
learn_episodes_per_run = 6
# A new lesson this similar to a stored one (search score) is that lesson learned again. Measured
# with the memory plugin's embedding: a lesson against itself 0.85, rewordings of one lesson
# 0.57-0.72, different lessons 0.29-0.49.
lesson_merge_score = 0.56
# Earlier runs without a learned mark taken up after a run is learned (the backlog).
learn_backlog_runs = 3
# The project's own contract (its AGENTS.md, else CLAUDE.md) in the system prompt, in characters;
# 0 = none.
contract_chars = 6000
# A change whose route names no file a language server checks reads the workspace's diagnostics
# before DECIDE, at most this many listed per server (errors first, the rest counted).
diagnostics_shown = 12

# rules: a prompt id, or a list joined in order (a part another stage of the same system prompt
# already carries is sent once).
# effort: none | low | medium | high | xhigh | decided (the router's, decide's or planner's choice).
# sampling: auto | a profile name.
[stage.ROUTE]
rules = "route"
schema = "schemas/router.json"
effort = "none"
sampling = "decision"

[stage.DECIDE]
rules = ["decide", "check_rules"]
schema = "schemas/decide.json"
effort = "none"
sampling = "decision"

# After a task that ended well, before the next: do the tasks still to do fit what the work
# showed? `replan` yes writes them again (within `replans`).
[stage.REVIEW]
rules = "review"
schema = "schemas/review.json"
effort = "none"
sampling = "decision"

[stage.CHECKS]
rules = ["checks", "check_rules"]
schema = "schemas/checks.json"
effort = "none"
sampling = "decision"

[stage.REPLY]
rules = "reply"
effort = "decided"
sampling = "auto"

# EXPERIMENT (2026-10-19, rule checks): `experiment_rule_checks` asks for one check per rule the
# request states only in words (seen: a rule with no example broken unnoticed). To switch it off,
# remove the id from DO's and TASK's rules (the prompt file can stay).
[stage.DO]
rules = ["do", "experiment_rule_checks"]
effort = "decided"
sampling = "auto"

[stage.TASK]
rules = ["task", "experiment_rule_checks"]
effort = "decided"
sampling = "auto"

# Questions (the router's LOOKUP and ANSWER): the model explores with its tools and answers.
[stage.ASK]
rules = "ask"
effort = "decided"
sampling = "auto"

# The session's spec: requirements extracted once from the message that became it.
[stage.SPEC]
rules = "spec"
schema = "schemas/spec.json"
effort = "none"
sampling = "auto"

# A message that changes the spec: added, dropped and changed requirement ids.
[stage.SPEC_EDIT]
rules = "spec_edit"
schema = "schemas/spec_edit.json"
effort = "none"
sampling = "decision"

# Plan mode: a plan document and a task graph, nothing changed.
[stage.PLAN]
rules = ["plan", "plan_fields", "check_rules"]
schema = "schemas/plan.json"
effort = "none"
sampling = "auto"

# A message while a plan is open: the plan's whole next version.
[stage.PLAN_EDIT]
rules = ["plan_edit", "plan_fields", "check_rules"]
schema = "schemas/plan.json"
effort = "none"
sampling = "auto"

# An open design question (route IDEATE). DISCOVER first: a tool loop that finds what the question
# depends on (the documents, the code, how it behaves now) and replies with its findings, the last
# message before IDEAS (outside the prefix: its rules are the step's own last message).
[stage.DISCOVER]
rules = "discover"
effort = "decided"
sampling = "auto"

# Then two calls around a host step. IDEAS: the question,
# its constraints and criteria, and one idea per generating principle (the schema's field names
# are the principles, so the ideas differ by construction). The host then looks every idea up
# (code graph, research notes, work elsewhere when online). OPTIONS: critique, the two or three
# options with their grounding picked from what the host found, a radical one and a recommendation.
[stage.IDEAS]
rules = "ideas"
schema = "schemas/ideas.json"
effort = "none"
sampling = "auto"

[stage.OPTIONS]
rules = "options"
schema = "schemas/options.json"
effort = "none"
sampling = "auto"

# Decisions the latest exchange settled, proposed for the user to accept.
# The project's description, written once when a project is first used (and again when its
# documents change): what the software is, no code. Stored in the graph, shown first in the brief.
[stage.DESCRIBE]
rules = "describe"
effort = "none"
sampling = "plain"

[stage.DECISIONS]
rules = "decisions"
schema = "schemas/decisions.json"
effort = "none"
sampling = "decision"

# Knowledge the latest message stated about the project's world, kept at once.
[stage.KNOWLEDGE]
rules = "knowledge"
schema = "schemas/knowledge.json"
effort = "none"
sampling = "decision"

# After a turn, one call per episode (a failure and what came after it), at idle priority:
# the lesson it teaches for other projects, or none.
[stage.LEARN]
rules = "learn"
schema = "schemas/learn.json"
effort = "none"
sampling = "decision"
