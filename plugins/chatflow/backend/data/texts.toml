# Every short model-facing text of cc-chatflow. `{name}` is filled in by the host; each text must
# keep exactly the placeholders it is shipped with (checked on load).

# ---- prompt layout --------------------------------------------------------------------------
# Marks a message from the host (the policy tells the model what it means).
host_prefix = "[host]"
protocol_heading = "Stages:"
protocol_stage = "[{stage}] {rules}"
section_project = "## Project folder\n`{root}` is the repository root: every command starts there, and every path is relative to it."
section_tools = "## Tools\n{text}"
section_rules = "## Project rules\n{text}"
section_style = "## How the user likes to work\n{text}"
# The project's knowledge brief (memory.knowledge.brief): decisions, facts, concepts, open questions.
section_contract = "## The project's own rules ({file})\n{text}"
section_knowledge = "## What the project knows\n{text}"
# Knowledge items found by meaning for the turn's work, one line each (after ROUTE).
knowledge_note = "What the project knows about this work (`read knowledge://<id>` for an item's evidence and the code it concerns):\n{text}"
# Lessons learned in earlier runs (any project) that fit the turn's work, one line each, with that note.
# The user set aside the direction given earlier (ROUTE's `drops`): the decisions withdrawn.
set_aside = "These earlier decisions of this conversation no longer hold; the user set them aside:\n{items}"
set_aside_reason = "set aside by the user in the conversation that made it"
lessons_note = "Lessons from earlier work, each learned where it went wrong before:\n{text}"
# Under a failure: what was learned the last time this failure came (one line each).
# A replay of a lesson (replay.rs) asks nobody for approval.
replay_denied = "Not run: this is a replay with nobody to approve it. Continue without this command."
lessons_failure = "This failed the same way in earlier work; what worked then:\n{text}"
# LEARN: one episode of a finished run, in host words (the stage's user message).
learn_card = "Languages: {languages}. The run ended {outcome}.\n{body}\nWrite the lesson this episode teaches, then judge it."
learn_refused = "A `{tool}` call was refused:\n{error}\nThe call: {call}\nThe next `{tool}` call, which worked: {fix}"
learn_repeated = "This command failed {times} times the same way: {command}\n{error}\nThen this worked: {fix}"
learn_red_green = "This command failed: {command}\n{error}\nThese edits made it pass:\n{edits}"
learn_retry = "The earlier attempt ended done; then this message said it was wrong:\n{message}\nWhat the work found:\n{found}\nThese edits fixed it, and the run ended done:\n{edits}"
learn_steer = "While the work ran, the user said: {message}\nThe steps before it: {before}\nThe steps after it: {after}"
# The one line after a learned run (the transcript only).
learned_note = "Learned {count} {items}."
# The skills catalog, in the stage messages of the stages that choose skills (ROUTE, PLAN).
skills_list = "Skills list (how-tos):\n{text}"
section_guide = "## Guide ({uri}): always applies in this project\n{text}"
language_guide = "## Guide ({uri}): applies to every {language} file in this project\n{text}"
skills_previous = "Skills used in the previous turn: {uris}. Choose them again when the latest message continues that work."
skills_chosen = "Skill for this work ({uri}):\n{text}"
skills_also = "\n\nAlso chosen; read each with `read` when you reach that part:\n{uris}"
work_open = "The work goes on: the tool keeps its state, and the steps so far are folded above. Run the command on the last line now.\n{output}"
work_open_stage = "A tool drives this work and reports it open. Its state and record files are not the repository. Your next step is the one the last line of its latest output names: the command, or the one-line reply it asks for."
skill_unavailable = "(the skill {uri} could not be read: {error})"
delegate_skills = "\nSkills for this work (read one when its topic comes up):\n{uris}"
section_map = "## Repository map\n{text}"
list_item = "- {text}"
stage = "Current stage: {stage}."
stage_live = "Current stage: {stage}.\n{live}"

# ---- conversation projection ----------------------------------------------------------------
steer = "(Sent while you were working.) {text}"
host_reads = "Results of the host's reads:"
# A host read named by what the model would read itself (a file, graph://, symbol://, outline://).
host_read = "### {number}. read {target}{failed}\n{output}"
# A host read without such a target (the repository map, the scheduler).
host_read_named = "### {number}. {what}{failed}\n{output}"
read_map = "Repository map around {focus}"
read_failed = " (failed)"
no_result = "(The host recorded no result for this call.)"
orphan_result = "Tool result: {output}"
folded = "(This {size}-byte output was folded to keep the conversation within the context window; what you concluded from it stands.)"
folded_artifact = "(This {size}-byte output was folded to keep the conversation within the context window. Its full text is readable as {artifact}.)"
turn_digest = "(The work of this turn was compacted to keep the conversation within the context window: its reasoning and tool outputs are no longer shown. Calls it made: {calls}. Read again what you need.)"
steps_digest = "(Earlier steps of this turn were compacted to keep the conversation within the context window: their reasoning and tool outputs are no longer shown. Calls they made: {calls}.{state} The newest steps follow; read a file again when you need its current text.)"
steps_state_files = " Files they changed: {files}."
steps_state_tests = " Their last test run, `{command}`: {failed} of {ran} failed{names}."
