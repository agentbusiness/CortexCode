plan_auto_parallel_live = "This plan is done right after you write it: every task whose depends_on are done runs at once, each by its own agent, on this computer or another, that sees only its task's brief ({count} agents are free); the rest follow as what they depend on finishes. Write each task as the edits its agent makes, with everything it needs: in which file, what is there now and what it becomes, the symbols by name, and the check that shows it is done. Reading and checking are steps inside each task, never tasks of their own. A part that can be done and checked on its own is a task of its own; a task that needs another's result names it in depends_on; a task that gathers the others' results comes last and depends on them all; two tasks that would change the same file depend on each other, so new files are laid out and registered by a first task and the parts fill them at the same time."
