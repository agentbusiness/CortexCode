# Outdated outputs once settled: the newest read, edit result or run of the same thing shows the
# current state; the older ones become one line each.
read_repeated = "(An older read of {path}; your latest read of the same lines, below, shows them as they are now.)"
read_in_view = "(Already in view: your earlier read of this file, above, shows these lines, and the file has not changed since. Work from that view.)"
read_unchanged = "(Unchanged: this read shows exactly what your earlier read of {path}, above, shows. Work from that view.)"
edit_superseded = "(An earlier edit of {path}; your latest edit result, below, shows it as it is now.)"
run_superseded = "(An earlier run of `{command}`; the newest run's output, below, is the one that counts.)"
read_superseded = "(An older view of {path}: your own edit changed it after this read; your latest edit result, below, shows it as it is now.)"
read_before_edit = "(Read before your later edit of {path}: the parts that edit changed are as its result shows; the other lines are as below and their anchors still work.)"
attempt_failed = "Task {n} ({title}) was stopped and its steps are no longer shown: {summary}\nWhat did not work in that attempt:\n{failures}{learned}\nThe files are as that attempt left them: read what you change before you change it, and take a different approach. Code that works and that the failure does not run through stays as it is."
attempt_failure = "- `{command}` still failed; the end of its output:\n{output}"
