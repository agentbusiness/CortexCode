# Every short model-facing text of cc-chatflow. `{name}` is filled in by the host; each text must
# keep exactly the placeholders it is shipped with (checked on load).

# ---- prompt layout --------------------------------------------------------------------------
# Marks a message from the host (the policy tells the model what it means).
host_prefix = "[host]"
protocol_heading = "Stages:"
protocol_stage = "[{stage}] {rules}"
section_project = "## Project folder\n`{root}` is the repository root: every command starts there, and every path is relative to it."
section_tools = "## Tools\n{text}"
section_rules = "## Project rules\n{text}"
section_style = "## How the user likes to work\n{text}"
# The project's knowledge brief (memory.knowledge.brief): decisions, facts, concepts, open questions.
section_contract = "## The project's own rules ({file})\n{text}"
section_knowledge = "## What the project knows\n{text}"
# Knowledge items found by meaning for the turn's work, one line each (after ROUTE).
knowledge_note = "What the project knows about this work (`read knowledge://<id>` for an item's evidence and the code it concerns):\n{text}"
# Lessons learned in earlier runs (any project) that fit the turn's work, one line each, with that note.
# The user set aside the direction given earlier (ROUTE's `drops`): the decisions withdrawn.
set_aside = "These earlier decisions of this conversation no longer hold; the user set them aside:\n{items}"
set_aside_reason = "set aside by the user in the conversation that made it"
lessons_note = "Lessons from earlier work, each learned where it went wrong before:\n{text}"
procedure_note = "A method reviewed by the owner for this project. Use only when it fits: {when}\n{steps}\nContinue the current task using its own requirements and evidence."
# Under a failure: what was learned the last time this failure came (one line each).
# A replay of a lesson (replay.rs) asks nobody for approval.
replay_denied = "Not run: this is a replay with nobody to approve it. Continue without this command."
runner_denied = "Not run: this job runs with nobody to approve anything, and nobody will answer. Do not ask and do not wait. Do the task without this call: find a way that stays inside the workspace and the sandbox, or leave this step out and say in the task's result what was not done and why. Then continue with the task."
lessons_failure = "This failed the same way in earlier work; what worked then:\n{text}"
# LEARN: one episode of a finished run, in host words (the stage's user message).
learn_card = "Languages: {languages}. The run ended {outcome}.\n{body}\nWrite the lesson this episode teaches, then judge it."
learn_refused = "A `{tool}` call was refused:\n{error}\nThe call: {call}\nThe next `{tool}` call, which worked: {fix}"
learn_repeated = "This command failed {times} times the same way: {command}\n{error}\nThen this worked: {fix}"
learn_red_green = "This command failed: {command}\n{error}\nThese edits made it pass:\n{edits}"
learn_retry = "The earlier attempt ended done; then this message said it was wrong:\n{message}\nWhat the work found:\n{found}\nThese edits fixed it, and the run ended done:\n{edits}"
learn_steer = "While the work ran, the user said: {message}\nThe steps before it: {before}\nThe steps after it: {after}"
# The one line after a learned run (the transcript only).
learned_note = "Learned {count} {items}."
# The skills catalog, in the stage messages of the stages that choose skills (ROUTE, PLAN).
skills_list = "Skills list (how-tos):\n{text}"
section_guide = "## Guide ({uri}): always applies in this project\n{text}"
language_guide = "## Guide ({uri}): applies to every {language} file in this project\n{text}"
skills_previous = "Skills used in the previous turn: {uris}. Choose them again when the latest message continues that work."
skills_chosen = "Skill for this work ({uri}):\n{text}"
skills_also = "\n\nAlso chosen; read each with `read` when you reach that part:\n{uris}"
work_open = "The work goes on: the tool keeps its state, and the steps so far are folded above. Run the command on the last line now.\n{output}"
work_open_stage = "A tool drives this work and reports it open. Its state and record files are not the repository. Your next step is the one the last line of its latest output names: the command, or the one-line reply it asks for."
skill_unavailable = "(the skill {uri} could not be read: {error})"
delegate_skills = "\nSkills for this work (read one when its topic comes up):\n{uris}"
section_map = "## Repository map\n{text}"
list_item = "- {text}"
stage = "Current stage: {stage}."
stage_live = "Current stage: {stage}.\n{live}"

# ---- conversation projection ----------------------------------------------------------------
steer = "(Sent while you were working.) {text}"
host_reads = "Results of the host's reads:"
# A host read named by what the model would read itself (a file, graph://, symbol://, outline://).
host_read = "### {number}. read {target}{failed}\n{output}"
# A host read without such a target (the repository map, the scheduler).
host_read_named = "### {number}. {what}{failed}\n{output}"
read_map = "Repository map around {focus}"
read_failed = " (failed)"
no_result = "(The host recorded no result for this call.)"
orphan_result = "Tool result: {output}"
folded = "(This {size}-byte output was folded to keep the conversation within the context window; what you concluded from it stands.)"
folded_artifact = "(This {size}-byte output was folded to keep the conversation within the context window. Its full text is readable as {artifact}.)"
turn_digest = "(The work of this turn was compacted to keep the conversation within the context window: its reasoning and tool outputs are no longer shown. Calls it made: {calls}. Read again what you need.)"
steps_digest = "(Earlier steps of this turn were compacted to keep the conversation within the context window: their reasoning and tool outputs are no longer shown. Calls they made: {calls}.{state} The newest steps follow; read a file again when you need its current text.)"
steps_state_files = " Files they changed: {files}."
steps_state_tests = " Their last test run, `{command}`: {failed} of {ran} failed{names}."
turn_digest_more = "{calls}, and {more} more"
turn_digest_failed = " (failed)"
decision_route = "Route: {route}."
decision = "Decision: {route}."
decision_missing = " Missing: {missing}"
decision_brief = "\nBrief: {brief}"
decision_checks = "\nChecks the host will run when the work is done:"
decision_check = "\n- `{command}`"
decision_reads = "\nReads requested: {reads}"

# ---- decisions --------------------------------------------------------------------------------
parse_retry = "Your previous output could not be read ({error}). Write only the JSON object."
decide_no_more = "No more reads in this request: choose ANSWER, DO, DELEGATE or PLAN from what is known."
no_reads = "Every read requested was already made; decide from the results above."
diagnostics_none = "No file the route named is one a language server checks: no diagnostics read."
reads_capped = "{skipped} of the requested reads were not made (at most {max} per round). If more is needed, ask for the most important ones."
context_full = "This needs more of the code than fits in the model's context at once ({tokens} tokens; {budget} fit). Ask about a narrower part, or delegate it to agents."

# ---- agent loop ---------------------------------------------------------------------------------
agent_live = "You are agent {name}."
team_live = "Others work on the same goal at the same time: {members}. What they post that bears on your task reaches you as a board message. When you need something from one of them, or from your lead (the conversation that gave you this task), run `cx board post --to <name or lead> --kind need \"<what you need>\"` and go on with what you can do.\n"
team_member = "{name} (\"{title}\")"
repetition = "You repeated {what} and got the same result each time, so repeating it again cannot help.{research} Take stock in a few lines (what you know, what is still missing) and take a different next step now."
# Added to the correction while the research plugin is active (a fact may be missing, not effort).
repetition_research = " When a fact is missing (how an API, a format or an error works), find out instead of guessing: `cx research deep <topic>` runs a cited research job, and the browser (`cx browser open <url>`) reads a page."
repeated_text = "the same text"
reread = "You read {what} already: it is above, unchanged. Work from that view."
learn_recheck = "Not an episode: a lesson kept from earlier work, judged again because the rules above changed.\nThe lesson: {lesson}\nWrite `lesson` as it stands. `useful`: by the rules above, as if it were learned now."
thought_cut = "Your thinking in the step above stopped at its budget. It had got this far:\n{thought}\nGo on from there, without working the task out again: take the step it was leading to."
rerun = "You ran {what} again with no edit since its last run: nothing it checks changed, so its earlier output above is still the answer, whatever you filter. Your next step is an edit; when it is your passing check, run the software the change is about, then reply with what changed."
# The same, before the task has changed any file: it is still finding out, so its step comes from the output it has (never "an edit" as what must come next).
rerun_before_edit = "You ran {what} again with nothing changed since its last run: its earlier output above is still the answer, whatever you filter. Take your next step from that output: read what it names, or make the change it points to."
checks_no_worse = "The checks fail only outside what this task changed, or where they failed before; the plan's last task makes every check pass: this task is done."
checks_unrun = "The host could not run these checks here: the machine killed them (e.g. for memory), so they show nothing about the work: {checks}. The task ends as it stands; the report of the work says they did not run."
baseline_known = "\n\nAlready failing before any change (leave them: task {n}, \"{title}\", fixes them after the others):\n{failures}"
build_task_title = "Make the project build"
build_task_brief = "These checks fail before any change and name no failing test: they stop before the tests run (the project does not build, or its compile-time checks fail).\n{checks}Every other task of the plan waits for this one. Run each check and fix what stops the build: the errors it shows, in whichever file they are. Change only what the build needs; the other tasks do the plan's work."
baseline_task_title = "Make every check pass"
baseline_task_brief = "These checks failed before any task of this plan changed the code:\n{failures}\nThe other tasks of the plan are done. Run each check; fix what it shows: these failures, and whatever the other tasks left failing outside their own files. Code that works and that no failure runs through stays as it is."
final_task_brief = "The other tasks of the plan are done; each made its own files right, and what failed outside them is this task's. Run each check:\n{checks}Fix what each one shows, until every check passes. Code that works and that no failure runs through stays as it is."
baseline_task_failure = "- `{command}`: {tests}\n"
baseline_task_unknown = "its failing tests are not named; its output shows them"
repeated_checks = "the same failing checks"
contract_failure = "The host ran the checks and they do not pass yet:\n{report}\nThe work is done when they pass, whatever made them fail. For each failure, find which side is wrong: the code, when it lost what the test checks; the test, when it checks behaviour the project changed on purpose (the code's comments, `git diff <file>`, `git log -L <start>,<end>:<file>` and the project's rules show which). Fix that side; code that works and that the failure does not run through stays as it is. Then run the checks again."
# The same for a plan task a later task waits for: the failures split by whose they are (the files
# this task changed, or the rest), so the model does not weigh "touch only your task" against
# "every check must pass" at each step (seen: one task answered both ways about ten times).
contract_failure_task = "The host ran this task's checks and they do not pass yet:\n{report}\n{outside}Fix what fails in the files this task changed. For each failure, find which side is wrong: the code, when it lost what the test checks; the test, when it checks behaviour the project changed on purpose (the code's comments, `git diff <file>`, `git log -L <start>,<end>:<file>` and the project's rules show which). Fix that side; code that works and that the failure does not run through stays as it is. Then run the checks again."
contract_failure_outside = "These fail only outside the files this task changed (the plan's last task fixes them: leave them):\n{report}\n"
check_passed = "\nCommand `{command}` passed."
check_failed = "\nCommand `{command}` failed with status {exit}:\n{output}\n"
check_failing_tests = "Failing tests:\n{tests}\n"
interrupted = "This call was interrupted when the chat flow restarted; its effect is unknown. Check the current state before repeating it."
skipped_steer = "Skipped: the user sent a message before this call ran; read it first."
skipped_stopped = "Skipped: the run was stopped before this call ran."
cancelled_running = "Cancelled by the user while running."
tools_stopped = "The tools plugin stopped while running this call ({error}); its effect is unknown. Check the current state before repeating it."
call_failed = "The call failed: {error}"
call_unsent = "The tool call could not be sent: {error}"
call_unreadable = "The tools plugin returned an unreadable result: {error}"
board_message = "Board message from {author} ({kind}): {text}"
