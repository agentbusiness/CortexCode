plan_edited_note = "You edited the plan by hand: version {version}."
implement_none = "There is no open plan to implement; ask for a plan first."
# One plan at work per folder, the newest: an older plan does not start beside it.
implement_newer = "Plan {plan_id} was not started: plan {newer}, written after it, is being carried out by agents now ({goal}). Two plans at work in one folder undo each other. Implement this plan when that work ends, or stop that work first."
