decision_reads = "\nReads requested: {reads}"

# ---- decisions --------------------------------------------------------------------------------
parse_retry = "Your previous output could not be read ({error}). Write only the JSON object."
decide_no_more = "No more reads in this request: choose ANSWER, DO, DELEGATE or PLAN from what is known."
no_reads = "Every read requested was already made; decide from the results above."
diagnostics_none = "No file the route named is one a language server checks: no diagnostics read."
reads_capped = "{skipped} of the requested reads were not made (at most {max} per round). If more is needed, ask for the most important ones."
context_full = "This needs more of the code than fits in the model's context at once ({tokens} tokens; {budget} fit). Ask about a narrower part, or delegate it to agents."

