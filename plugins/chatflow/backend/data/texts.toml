# For the user, when a turn ends: what the host removed of what the turn's commands left (each removal is a step that can be undone).
cleanup_removed = "Removed when the turn ended (new files its commands left, not part of the change):\n{files}\n`cx undo --step N` brings one back; `cx changed` lists the steps."

