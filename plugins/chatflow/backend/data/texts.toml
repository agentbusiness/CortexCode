plan_task_touches = "\n   touches: {items}"
plan_task_checks = "\n   checks: {items}"
plan_task_covers = "\n   covers: {items}"
plan_task_skills = "\n   skills: {items}"
plan_superseded = "(Plan {plan_id}, version {version}: replaced by a later version below.)"
plan_live_edit = "The open plan is {plan_id}, version {version}."
plan_parallel = "{count} agent(s) can each run one task at the same time, each seeing only its task's brief. Cut the tasks along files, so they can run at the same time:\n1. Two tasks that would change the same file depend on each other.\n2. When the parts add new files, a first task, \"Lay out …\", adds each new file with nothing in it yet and registers it (a `mod` line, an export, an import, a route entry); the part tasks depend on it and change only their own files.\n3. A task that needs another's result names it in depends_on; a task that gathers the others' results comes last and depends on them all.\nExample: \"add an input parser and a result cache, and make the report command use them\" is four tasks: 1 \"Lay out parser and cache\" adds both files, empty, and registers them; 2 \"Parse the input\" and 3 \"Cache parsed results\", both after 1, at the same time; 4 \"Report uses parser and cache\" (after 2 and 3)."
plan_auto_parallel_live = "This plan is carried out right after you write it: every task whose depends_on are done runs at once, each by its own agent, on this computer or another, that sees only its task's brief. Write each brief with everything its agent needs. Give a task only the checks that can pass once it is done. Cut the tasks along files, so they can run at the same time:\n1. Two tasks that would change the same file depend on each other.\n2. When the parts add new files, a first task, \"Lay out …\", adds each new file with nothing in it yet and registers it (a `mod` line, an export, an import, a route entry); the part tasks depend on it and change only their own files.\n3. A task that needs another's result names it in depends_on; a task that gathers the others' results comes last and depends on them all.\nExample: \"add an input parser and a result cache, and make the report command use them\" is four tasks: 1 \"Lay out parser and cache\" adds both files, empty, and registers them; 2 \"Parse the input\" and 3 \"Cache parsed results\", both after 1, at the same time; 4 \"Report uses parser and cache\" (after 2 and 3)."
units_task_brief = "One unit of the work of {skill}: {unit}, {title}. Read the skill first; do this unit only, with the skill's commands given `--unit {unit}` (other agents do the other units at the same time, in this same project folder). The unit is done when the skill's command says it is settled: reply with the one line it prints then."
# A lead session's plan: its tasks go to frontier agents (docs/FRONTIER-AGENTS.md).
plan_lead = "Each task goes to a frontier agent that plans and carries out its own steps, in this same project folder, at the same time as the other tasks whose depends_on are done. Cut the work into whole pieces:\n1. One task per piece of the software a person would name (a command, a screen, a module with its tests); a small change is one task.\n2. Never a task that only adds empty files, lays out names or registers modules: the task that writes the code does that.\n3. A task depends on another only when it needs that task's result for its own work, or both change the same file; a task that builds on, runs or takes further what others make depends on all of them; never for build order, so every task that can start now starts now.\nExample: \"add an input parser and a result cache, and make the report command use them\" is two tasks: 1 \"Parse and cache the input\", 2 \"Report uses the parsed input\" (after 1)."
units_summary_title = "Finish the whole: the report"
units_summary_brief = "Every unit of the work of {skill} is done by the other tasks. Read the skill, then finish the whole as it says (its command writes the report over all units and prints it); reply with what the skill says the final reply holds: the summary, every finding, what was not covered, and the report's path."
plan_task_context = "\n\nPart of plan {plan_id}: {goal}\nThe plan's tasks (this one is {n}; agents work on the others at the same time or after it):{tasks}\nThe other tasks use the names this one keeps and adds: keep every existing name as it is, so their code still fits."
plan_task_known = "\nAlready known from the conversation (no need to read it again):\n{items}"
plan_task_write = "\n\nNext: make the change with your edit tool, then run this task's check."
plan_task_write_files = "\n\nNext: make the change in {files} with your edit tool, then run this task's check."
plan_task_missing = "\n\nNot in the project yet, and no task of this plan adds them: {names}. When this task needs one, add it here; when it is too big for this task, tell the session at once what is missing."
plan_task_rules = "\nThe rules this task makes true. Say in your reply how each was shown, by a test of the project or by a run's output:\n{items}"
implement_request = "Implement the approved plan."
