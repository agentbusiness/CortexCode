decision_route = "Route: {route}."
decision = "Decision: {route}."
decision_missing = " Missing: {missing}"
decision_brief = "\nBrief: {brief}"
decision_checks = "\nChecks the host will run when the work is done:"
decision_check = "\n- `{command}`"
decision_reads = "\nReads requested: {reads}"

# ---- decisions --------------------------------------------------------------------------------
parse_retry = "Your previous output could not be read ({error}). Write only the JSON object."
decide_no_more = "No more reads in this request: choose ANSWER, DO, DELEGATE or PLAN from what is known."
no_reads = "Every read requested was already made; decide from the results above."
diagnostics_none = "No file the route named is one a language server checks: no diagnostics read."
reads_capped = "{skipped} of the requested reads were not made (at most {max} per round). If more is needed, ask for the most important ones."
context_full = "This needs more of the code than fits in the model's context at once ({tokens} tokens; {budget} fit). Ask about a narrower part, or delegate it to agents."

# ---- agent loop ---------------------------------------------------------------------------------
agent_live = "You are agent {name}."
repetition = "You repeated {what} and got the same result each time, so repeating it again cannot help. If nothing else can be done, say what blocks the work.{research} Otherwise take stock in a few lines (what you know, what is still missing) and take a different next step now."
# Added to the correction while the research plugin is active (a fact may be missing, not effort).
repetition_research = " When a fact is missing (how an API, a format or an error works), find out instead of guessing: `cx research deep <topic>` runs a cited research job, and the browser (`cx browser open <url>`) reads a page."
repeated_text = "the same text"
reread = "You read {what} already and got the same lines each time: you have them above. Continue with your next step."
repeated_checks = "the same failing checks"
contract_failure = "The host ran the checks and they do not pass yet:\n{report}\nIf it truly cannot be fixed, say what blocks it. Otherwise find the cause in the output above and fix it there; code that works and that the failure does not run through stays as it is. Then run the checks again."
check_passed = "\nCommand `{command}` passed."
check_failed = "\nCommand `{command}` failed with status {exit}:\n{output}\n"
interrupted = "This call was interrupted when the chat flow restarted; its effect is unknown. Check the current state before repeating it."
skipped_steer = "Skipped: the user sent a message before this call ran; read it first."
skipped_stopped = "Skipped: the run was stopped before this call ran."
cancelled_running = "Cancelled by the user while running."
tools_stopped = "The tools plugin stopped while running this call ({error}); its effect is unknown. Check the current state before repeating it."
call_failed = "The call failed: {error}"
call_unsent = "The tool call could not be sent: {error}"
call_unreadable = "The tools plugin returned an unreadable result: {error}"
board_message = "Board message from {author} ({kind}): {text}"
generation_failed = "Your last reply could not be used ({error}). Write it again; tool call arguments must be valid JSON."
approval_denied = "The user did not approve this call ({classes}); it was not run. If you need it, explain what and why. Otherwise continue without it."
job_exited = "Background job {job_id} exited with {exit}:\n{output}"
job_killed = "Background job {job_id} was killed:\n{output}"
job_lost = "Background job {job_id} ended; its exit status is unknown:\n{output}"
job_matched = "Background job {job_id} printed a line matching its wake pattern:\n{matched}"
