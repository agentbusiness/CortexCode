# Every short model-facing text of cc-chatflow. `{name}` is filled in by the host; each text must
# keep exactly the placeholders it is shipped with (checked on load).

# ---- prompt layout --------------------------------------------------------------------------
# Marks a message from the host (the policy tells the model what it means).
host_prefix = "[host]"
protocol_heading = "Stages:"
protocol_stage = "[{stage}] {rules}"
section_tools = "## Tools\n{text}"
section_rules = "## Project rules\n{text}"
section_style = "## How the user likes to work\n{text}"
# The project's knowledge brief (memory.knowledge.brief): decisions, facts, concepts, open questions.
section_contract = "## The project's own rules ({file})\n{text}"
section_knowledge = "## What the project knows\n{text}"
# Knowledge items found by meaning for the turn's work, one line each (after the first round's reads).
# The after-action KNOWLEDGE call's trailing line (an agent run with a contract that did not go clean).
afteraction_live = "The work ended ({outcome}). Write only what its steps proved about this project's world: a cause confirmed or ruled out (a hypothesis, supported or refuted), how the environment or a dependency behaves (a fact), what a term means here (a concept). Nothing the request already said, nothing about the code's shape, nothing unproven."
knowledge_note = "What the project knows about this work (`read knowledge://<id>` for an item's evidence and the code it concerns):\n{text}"
# The skills catalog, in the stage messages of the stages that choose skills (ROUTE, PLAN).
skills_list = "Skills list (how-tos):\n{text}"
section_guide = "## Guide ({uri}): always applies in this project\n{text}"
skills_previous = "Skills used in the previous turn: {uris}. Choose them again when the latest message continues that work."
skills_chosen = "Skill for this work ({uri}):\n{text}"
skills_also = "\n\nAlso chosen; read each with `read` when you reach that part:\n{uris}"
skill_unavailable = "(the skill {uri} could not be read: {error})"
delegate_skills = "\nSkills for this work (read first):\n{uris}"
section_map = "## Repository map\n{text}"
list_item = "- {text}"
stage = "Current stage: {stage}."
stage_live = "Current stage: {stage}.\n{live}"

# ---- conversation projection ----------------------------------------------------------------
steer = "(Sent while you were working.) {text}"
host_reads = "Results of the host's reads:"
# A host read named by what the model would read itself (a file, graph://, symbol://, outline://).
host_read = "### {number}. read {target}{failed}\n{output}"
# A host read without such a target (the repository map, the scheduler).
host_read_named = "### {number}. {what}{failed}\n{output}"
read_map = "Repository map around {focus}"
read_failed = " (failed)"
no_result = "(The host recorded no result for this call.)"
orphan_result = "Tool result: {output}"
folded = "(This {size}-byte output was folded to keep the conversation within the context window. Run the call again if you need it.)"
folded_artifact = "(This {size}-byte output was folded to keep the conversation within the context window. Its full text is readable as {artifact}.)"
turn_digest = "(The work of this turn was compacted to keep the conversation within the context window: its reasoning and tool outputs are no longer shown. Calls it made: {calls}. Read again what you need.)"
turn_digest_more = "{calls}, and {more} more"
turn_digest_failed = " (failed)"
decision_route = "Route: {route}."
decision = "Decision: {route}."
decision_missing = " Missing: {missing}"
decision_brief = "\nBrief: {brief}"
decision_checks = "\nChecks the host will run when the work is done:"
decision_check = "\n- `{command}`"
decision_reads = "\nReads requested: {reads}"

# ---- decisions --------------------------------------------------------------------------------
parse_retry = "Your previous output could not be read ({error}). Write only the JSON object."
decide_no_more = "No more reads in this request: choose ANSWER, DO, DELEGATE or PLAN from what is known."
no_reads = "Every read requested was already made; decide from the results above."
diagnostics_none = "No file the route named is one a language server checks: no diagnostics read."
reads_capped = "{skipped} of the requested reads were not made (at most {max} per round). If more is needed, ask for the most important ones."
context_full = "This needs more of the code than fits in the model's context at once ({tokens} tokens; {budget} fit). Ask about a narrower part, or delegate it to agents."

# ---- agent loop ---------------------------------------------------------------------------------
agent_live = "You are agent {name}."
repetition = "You repeated {what} and got the same result each time, so repeating it again cannot help. If nothing else can be done, say what blocks the work.{research} Otherwise take stock in a few lines (what you know, what is still missing) and take a different next step now."
# Added to the correction while the research plugin is active (a fact may be missing, not effort).
repetition_research = " When a fact is missing (how an API, a format or an error works), find out instead of guessing: `cx research deep <topic>` runs a cited research job, and the browser (`cx browser open <url>`) reads a page."
repeated_text = "the same text"
repeated_checks = "the same failing checks"
contract_failure = "The host ran the checks and they do not pass yet:\n{report}\nIf it truly cannot be fixed, say what blocks it. Otherwise find the cause in the output above, fix it, and run the checks again."
check_passed = "\nCommand `{command}` passed."
check_failed = "\nCommand `{command}` failed with status {exit}:\n{output}\n"
interrupted = "This call was interrupted when the chat flow restarted; its effect is unknown. Check the current state before repeating it."
skipped_steer = "Skipped: the user sent a message before this call ran; read it first."
skipped_stopped = "Skipped: the run was stopped before this call ran."
cancelled_running = "Cancelled by the user while running."
tools_stopped = "The tools plugin stopped while running this call ({error}); its effect is unknown. Check the current state before repeating it."
call_failed = "The call failed: {error}"
call_unsent = "The tool call could not be sent: {error}"
call_unreadable = "The tools plugin returned an unreadable result: {error}"
board_message = "Board message from {author} ({kind}): {text}"
generation_failed = "Your last reply could not be used ({error}). Write it again; tool call arguments must be valid JSON."
approval_denied = "The user did not approve this call ({classes}); it was not run. If you need it, explain what and why. Otherwise continue without it."
job_exited = "Background job {job_id} exited with {exit}:\n{output}"
job_killed = "Background job {job_id} was killed:\n{output}"
job_lost = "Background job {job_id} ended; its exit status is unknown:\n{output}"
job_matched = "Background job {job_id} printed a line matching its wake pattern:\n{matched}"
job_silent = "Background job {job_id} printed nothing for {seconds} s. Its last output:\n{output}"
job_artifact = "\nFull output: artifact://{artifact}"
job_artifact_running = "\nIts output so far: artifact://{artifact}"

# ---- impact injection ---------------------------------------------------------------------------
impact_heading = "Your edit changed these signatures:"
impact_changed = "\n- `{name}` ({path}): `{before}` -> `{after}`"
impact_vanished = "\n- `{name}` ({path}) no longer exists under that name (was `{before}`)"
impact_sites = "\nCall sites to check (anchor|current line; arguments as written):"
impact_site = "\n- {path}  {line}  args: ({args})"
impact_tests = "\nTests affected:"
impact_test = "\n- {name} ({path})"
impact_close = "\nUpdate every call site that no longer fits, then run the affected tests."

# ---- contract checks ------------------------------------------------------------------------------
baseline = "Before any change, the host ran the checks:"
checks_after = "The host ran the checks after the work and they failed:"
check_output = "\nCommand `{command}` exited with status {exit}:\n{output}\n"
checks_list = "Checks the host will run when the work is done (each must exit with status 0):"
checks_none = "No check command can show this work; the host will not verify it by command."
checks_accepted = "The planner accepted your revision of the checks: {reason}"
checks_refused = "Your revision of the checks was not accepted: {reason}\nThe checks stand as they are; make the work pass them."
checks_no_reviewer = "no one but the task's worker could accept it (the planner is not available)"
checks_indeterminate = "The machine-checkable checks pass, but the host cannot decide these itself, so a person must judge them:{checks}"

# ---- agent tasks ----------------------------------------------------------------------------------
task = "Task: {title}\n\n{brief}"
task_plan = "\n\nPlan:\n{plan}"
task_contract = "\n\nContract (the host runs these checks in your workspace when you stop; all must pass):"
task_check = "\n- `{command}`"
task_touches = "\n\nTouches: {touches}"

# ---- delegation -----------------------------------------------------------------------------------
delegated = "Delegated \"{title}\" as {count} task(s):"
delegated_task = "\n- {title}{assignee}{depends}"
delegated_assignee = " -> {name}"
delegated_after = " (after {count})"
delegated_agents = "\nAgents started: {names}."
delegation_failed = "Delegation failed: {error}. Nothing was started."
delegation_unreadable = "Delegated, but the agents plugin's answer could not be read: {error}"
delegate_context = "Work as stated: {work}\nNot yet known when delegating: {missing}"

# ---- attachments (after a user message's text; paths the model reads with its tools) ---------
attachments = "Attached to this message ({count}); read them with your tools as needed:\n{items}"
attachment_file = "- file {name}: `{path}` ({size})"
attachment_folder = "- folder {name}: `{path}`; its top level:\n{listing}"
attachment_image = "- image {name}: `{path}` ({size}{dims}). {seen}"
attachment_image_dims = ", {width}×{height} px"
attachment_unseen = "You cannot see images and no vision capability described it: only its file and these facts are known."
attachment_seen = "Described by {by}: {description}"
attachment_listing_more = "… and {count} more"
attachment_listing_empty = "(empty)"
attachment_listing_unreadable = "(the folder could not be listed)"
attachment_shown = "The image itself is part of this message."
attachment_pasted_whole = "- pasted text {name}: `{path}` ({size}, {lines} lines), shown whole:\n{preview}"
attachment_pasted = "- pasted text {name}: `{path}` ({size}, {lines} lines). Only its first and last lines are shown here; read or search the file for the rest:\n{preview}"
attachment_preview_gap = "… {count} lines not shown …"
attachment_preview_cut = " … ({count} more characters)"

# ---- other repositories the message references (@project mentions, folder attachments) -------
references = "Other repositories the user referenced, read-only (never edit them). Read them with `read`:\n{items}"
reference_project = "- {name}: `{root}`{state}. graph://{name}/search/<words>, symbol://{name}/<name>, outline://{name}/<path>, definition://{name}:<path:line:col>, files {name}:<path>"
reference_listing = " (being indexed)"
reference_indexing = " (being indexed: {done} of {total} files)"
reference_symbol = "\n  {asked}: {kind} {qname} at {name}:{path}:{start}-{end}"
reference_symbol_more = "\n  {asked}: {count} more; read symbol://{name}/{asked}"
reference_symbol_pending = "\n  {asked}: located once indexed; read symbol://{name}/{asked}"
reference_symbol_missing = "\n  {asked}: not found; try graph://{name}/search/{asked}"
reference_symbol_failed = "\n  {asked}: not located ({error})"
reference_unknown = "- {project}: no such project"
reference_failed = "- {project}: not opened ({error})"

verifiers_candidates = "This project's own check commands (`checks` picks among them; none when none covers the work):\n{list}"
verifier_line = "- {kind}: `{command}`"

# ---- spec (pinned right after the system prompt, never folded) -------------------------------------
spec_pinned = "Spec, version {version}: {title}\n{text}"
spec_requirements = "\n\nRequirements (id [status] text):"
spec_requirement = "\n- {id} [{status}] {text}"
spec_decisions = "\n\nDecisions:"
decisions_pinned = "Decisions settled in this conversation:"
decision_line = "\n- {decided}{because}{rejected}"
decision_because = "; because {text}"
decision_rejected = "; rejected: {text}"
spec_source = "(This message became the session's spec, version {version}, shown at the start of the conversation.)"
spec_changed = "The spec is now version {version} (shown at the start of the conversation): {changes}."
spec_created = "made from the message, with {count} requirements"
spec_added = "added {ids}"
spec_dropped = "dropped {ids}"
spec_modified = "changed {ids}"
spec_edited = "edited by the user"
spec_decided = "decision added: {decided}"
spec_unchanged = "The latest message did not change the spec's requirements."
spec_failed = "The spec's requirements could not be extracted ({error}); the message is kept as the spec without a checklist."
spec_live = "Open requirements of the spec (shown at the start of the conversation): {ids}."
spec_review = "When the work is done, end your summary with one line per open requirement of the spec ({ids}): its id, whether the change covers it, and how you know."
spec_attached = "\n\n[{name}]\n{text}"
spec_attached_ref = "\n\n[{name} is too long to keep in the spec; read `{path}` with your tools]"
spec_saved = "The spec was written to {path}."
# The spec as a file in the repository (docs/specs/<slug>.md).
spec_md = "# {title}\n\nVersion {version}.\n\n{text}\n"
spec_md_requirements = "\n## Requirements\n"
spec_md_requirement = "\n- {id} ({status}): {text}"
spec_md_decisions = "\n\n## Decisions\n"

# ---- plans ---------------------------------------------------------------------------------------
plan_heading = "Plan {plan_id}, version {version} ({status}):"
plan_analysis = "\nAnalysis: {text}"
plan_goal = "\nGoal: {text}"
plan_approach = "\nApproach: {text}"
plan_steps = "\nSteps:"
plan_step = "\n{number}. {text}"
plan_architecture = "\nArchitecture: {text}"
plan_risks = "\nRisks:"
plan_risk = "\n- {text}"
plan_tasks = "\nTasks:"
plan_task_compact = "\n{number}. {title} ({state})"
plan_task = "\n{number}. {title}{after}: {brief}"
plan_task_after = " (after {numbers})"
plan_task_touches = "\n   touches: {items}"
plan_task_checks = "\n   checks: {items}"
plan_task_covers = "\n   covers: {items}"
plan_task_skills = "\n   skills: {items}"
plan_superseded = "(Plan {plan_id}, version {version}: replaced by a later version below.)"
plan_live_edit = "The open plan is {plan_id}, version {version}."
plan_task_context = "\n\nPart of plan {plan_id}. Goal: {goal}\nApproach: {approach}"
plan_task_requirements = "\nThe statement's requirements this task must meet, each with a case in the check script:\n{items}\nA general rule also holds inside each special case the statement names (a first or last item, an empty input, a boundary): give it a case there too."
implement_request = "Implement the approved plan."
implement_none = "There is no open plan to implement; ask for a plan first."
implement_started = "Implementing plan {plan_id}, version {version}: {count} task(s)."
implement_failed = "The plan could not be handed to the agents ({error}); it stays approved."
# A decided change is planned first (PLAN, told so) and carried out one step per run of the DO
# loop: the loop is given its step and what the earlier steps did; its reply ends the step.
plan_auto_live = "This plan is done right after you write it, here, one task at a time in order, with short thinking for each: do the thinking now. Write each task as what must be true when it is done, never as code; reading and checking are steps inside each task, never tasks of their own. Give a task only the checks that can pass once it is done. One task for the whole work, unless the request names several parts: then one task per part, each after the one it builds on."
plan_from_spec = "The plan's tasks are the statement's requirements, one each, in their order ({count} tasks)."
do_step = "{goal}Your job now is only task {n} of {of}: {text}\n{later}{done}Do this task only:\n1. The files it touches are shown above as they are now; read them again only if a command changed them.\n2. Think the whole change through, then make it with edit. A file you have not changed yet (a new file or a stub) you may write whole once with `content`; after that, change it only with anchored edits, every change to it in one call: a second whole write is refused.\n3. Add this task's cases to the check script with edit (make it when there is none; it exits 1 when any case fails) and run it: this task's cases and every earlier case. Build inputs with a small helper that assembles a complete input from its parts, or in code ([0] * 100), never by writing long lists or counting in your thinking.\nWhen a case fails, change only the code that case runs through; a function whose cases pass is left as it is unless the task asks to change it.\n4. Reply with what changed, what the check showed, and anything you found that a later task must take into account.\nThink in a few lines; code goes into edit, results come from running."
do_step_goal = "The whole work: {goal}\n"
do_step_later = "Later tasks, not now: {titles}.\n"
do_step_last = " This is the last task; after your reply the host runs its checks."
do_task_text = "{title}. {brief}"
task_start = "Task {n} of {of}: {title}"
task_nudge = "Task {n} ({title}) ended without a single tool call, so nothing was done for it. If something stops you, say what. Otherwise do the task now with your tools (edit, run, read)."
plan_replan_live = "Task {n} ({title}) ended {outcome}: {summary}\nTasks 1 to {done} are done and stay as they are. Write only the tasks still to do, as a new list numbered from 1 (`depends_on` uses these new numbers), with the approach changed where the outcome shows it was wrong."
plan_revise_live = "Task {n} ({title}) is done and showed that the tasks after it must change: {summary}\nTasks 1 to {done} are done and stay as they are. Write only the tasks still to do, as a new list numbered from 1 (`depends_on` uses these new numbers), changed to fit what was found."
review_live = "Task {n} ({title}) is done. The tasks still to do:\n{tasks}\nDo they still fit what the work so far showed?"
review_task = "{n}. {title}: {brief}"
read_superseded = "(An older view of {path}: your own edit changed it after this read. Your latest edit result shows the changed code as it is now; read the file again for other parts.)"
attempt_failed = "Task {n} ({title}) was stopped and its steps are no longer shown: {summary}\nWhat did not work in that attempt:\n{failures}\nThe files are as that attempt left them: read what you change before you change it, and take a different approach."
attempt_failure = "- `{command}` still failed; the end of its output:\n{output}"
attempt_no_failure = "- no command was left failing; the work did not reach a passing check."
coverage_missing = "Before this task is done: your check script does not yet test these requirements with a case that meets them and a case that breaks them:\n{items}\nAdd those cases to the check script and run it."
task_stuck = "it did not finish in {calls} tool calls. Where it stood: {last}"
task_stuck_fixes = "its failing command still failed after {fixes} fixes ({calls} tool calls). Where it stood: {last}"
do_step_done = "Done so far:\n{items}"
do_step_done_item = "- task {n}: {summary}\n"
# The documents the project description is written from (DESCRIBE).
describe_inputs = "Folders and files at the top of the repository:\n{listing}\n\nLanguages: {languages}\n\n{documents}"
describe_document = "--- {name} ---\n{text}\n\n"
