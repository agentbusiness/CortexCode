repetition_research = " When a fact is missing (how an API, a format or an error works), find out instead of guessing: `cx research deep <topic>` runs a cited research job, and the browser (`cx browser open <url>`) reads a page."
repeated_text = "the same text"
reread = "You read {what} already: it is above, unchanged. Your next step is the edit it was read for."
rerun = "You ran {what} again with no edit since its last run: nothing it checks changed, so its earlier output above is still the answer, whatever you filter. Your next step is an edit; when it is your passing check, reply with what changed."
checks_no_worse = "The checks fail only outside what this task changed, or where they failed before; the plan's last task makes every check pass: this task is done."
baseline_known = "\n\nAlready failing before any change (leave them: task {n}, \"{title}\", fixes them after the others):\n{failures}"
build_task_title = "Make the project build"
build_task_brief = "These checks fail before any change and name no failing test: they stop before the tests run (the project does not build, or its compile-time checks fail).\n{checks}Every other task of the plan waits for this one. Run each check and fix what stops the build: the errors it shows, in whichever file they are. Change only what the build needs; the other tasks do the plan's work."
baseline_task_title = "Make every check pass"
baseline_task_brief = "These checks failed before any task of this plan changed the code:\n{failures}\nThe other tasks of the plan are done. Run each check; fix what it shows: these failures, and whatever the other tasks left failing outside their own files. Code that works and that no failure runs through stays as it is."
final_task_brief = "The other tasks of the plan are done; each made its own files right, and what failed outside them is this task's. Run each check:\n{checks}Fix what each one shows, until every check passes. Code that works and that no failure runs through stays as it is."
baseline_task_failure = "- `{command}`: {tests}\n"
baseline_task_unknown = "its failing tests are not named; its output shows them"
repeated_checks = "the same failing checks"
contract_failure = "The host ran the checks and they do not pass yet:\n{report}\nThe work is done when they pass, whatever made them fail. For each failure, find which side is wrong: the code, when it lost what the test checks; the test, when it checks behaviour the project changed on purpose (the code's comments, `git diff <file>`, `git log -L <start>,<end>:<file>` and the project's rules show which). Fix that side; code that works and that the failure does not run through stays as it is. Then run the checks again."
check_passed = "\nCommand `{command}` passed."
check_failed = "\nCommand `{command}` failed with status {exit}:\n{output}\n"
interrupted = "This call was interrupted when the chat flow restarted; its effect is unknown. Check the current state before repeating it."
skipped_steer = "Skipped: the user sent a message before this call ran; read it first."
skipped_stopped = "Skipped: the run was stopped before this call ran."
