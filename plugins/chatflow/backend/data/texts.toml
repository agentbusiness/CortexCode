plan_auto_live = "This plan is done right after you write it, here, one task at a time in order, with short thinking for each: do the thinking now. Write each task as the edits its agent makes: in which file, what is there now and what it becomes, the symbols by name, and the check that shows it is done; reading and checking are steps inside each task, never tasks of their own. Give a task only the checks that can pass once it is done. One task per part that can be built and checked on its own (a new file, a function group, a command), each after the one it builds on."
do_step = "{goal}Your job now is only task {n} of {of}: {text}\n{later}{done}Do this task only:\n1. The files it touches are shown above as they are now; read them again only if a command changed them.\n2. Decide the data types first, so that each function can return what it must; then think the whole change through and make it with edit: a new file is written whole with `content`; an existing file is changed only where it needs changing. Strict rule: an existing file is never written whole again; change it with anchored edits, one or two functions per edit: write those, then move to the next ones. A class with its methods counts as one; the anchors of lines you do not change stay valid between edits. Read project files only with read and change them only with edit: cat, sed and here-documents on project files are blocked in run.\n3. Check the change by running only the request's examples: one line per example, input and expected value copied from the request, never computed or changed; no case the request does not give. When the project has tests, run them before and after the change and add the request's examples there. A project without tests gets them, in the place its language skill names (usually `tests/`); they stay in the project. When the request gives no examples, run every function you wrote at least once, with checks that follow from the inputs (what goes in comes out, a count after two adds is 2), never hand-computed values, in those tests. A one-off try (call a function, print a value) goes in `tmp/`, which git ignores. Build inputs with a small helper that assembles a complete input from its parts, or in code, never by writing long lists or counting in your thinking.\n4. When a test fails, find out from the request and the project whether the code, the input you built or the expected value is wrong (an error your code raises on purpose often means the input is wrong); never change an expected value just to match what the code printed. When a failure shows how the tests use your code (a type, an exception, a name), apply that everywhere it fits, not only on the failing line. When a check cannot run here (the sandbox stops it), say so: never change the user's shell setup, tool settings or files outside the project to get it through. When the request and every output you have seen leave a value open (an exact message, a format, a name), never guess it silently: use the request's closest words and list each such choice in your reply as `Assumed: …`. Then change only the code that test runs through. Never rewrite, reformat or clean up code that works, and never write a working file whole again: change only the lines the task needs. Code that works and that the task does not touch stays exactly as it is, unless the user asks to change it.\n5. Reply with what changed, what the tests showed (the test for each rule of the task), every value you assumed (`Assumed: …`), anything you found that a later task must take into account, and what more should be done that the user did not ask for.\nThink in a few lines; code goes into edit, results come from running. Names, style and warnings in code your check passes are not part of the task: when the task's check passes, reply."
