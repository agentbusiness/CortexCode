attempt_skill = "\nSkill the failures led to ({uri}):\n{text}"
attempt_skills_also = "\nAlso led to; read each with `read` when you reach that part:\n{uris}"
attempt_no_failure = "- no command was left failing; the work did not reach a passing check."
