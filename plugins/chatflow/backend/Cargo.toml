[package]
name = "cc-chatflow"
description = "CortexCode chat flow (chatflow@1): router, parallel host reads, missing-first decide, and the coding agent loop."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false

# A self-contained plugin: its own workspace, depending only on the protocol.
[workspace]

[lib]
name = "cc_chatflow"
path = "src/lib.rs"

[[bin]]
name = "cc-chatflow"
path = "src/bin/cc-chatflow.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["agents", "chatflow", "checks", "hashline", "host", "lang", "memory", "mesh", "model", "schedule", "skills", "source", "tools"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.23", features = ["v4"] }
toml = "1.1.8"
regex = "1.12"
futures = "0.3.32"
sha2 = "0.10.9"
base64 = "0.22.1"

[profile.release]
debug = 1

[dev-dependencies]
tempfile = "3"
