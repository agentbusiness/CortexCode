[package]
name = "cortex-frame"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexCode frame: plugin supervisor, router, hot-swap engine, journal owner and WebSocket/HTTP API."

[[bin]]
name = "cortex-frame"
path = "src/main.rs"

[workspace]
members = []
default-members = ["."]
resolver = "3"

[dependencies]
# preserve_order: the frame relays requests and events with their JSON key order intact.
cc-protocol = { path = "../protocol", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
notify = "8.2.0"
sha2 = "0.10.9"
hex = "0.4.3"
toml = "0.9.12"
clap = { version = "4.6.2", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libc = "0.2.190"
getrandom = "0.3.4"
uuid = { version = "1.23", features = ["v4"] }
core-foundation = "0.10.1"
core-foundation-sys = "0.8"
objc2 = "0.6.5"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }
thiserror = "2.0.18"
# .ccplugin packages: gzip-compressed tar archives.
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
