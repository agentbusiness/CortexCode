[package]
name = "cc-stats-kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "Every app's errors, and its call counts and model calls summed per five minutes: collected in every process, written as Parquet day files and delivered to a CortexManage by the stats plugin (feature `files`); shared by every Cortex app and the knowledge app."

# Standalone: every process that records depends on this crate by path.
[workspace]

[lib]
name = "cc_stats_kit"
path = "src/lib.rs"

# The day files and their delivery: only the stats plugin (and the knowledge app) builds them.
[features]
files = ["dep:arrow-array", "dep:arrow-json", "dep:arrow-schema", "dep:parquet"]

[dependencies]
cc-protocol = { path = "../protocol", features = ["reports", "mesh", "model"] }
arrow-array = { version = "58.1.0", optional = true }
arrow-json = { version = "58.1.0", optional = true }
arrow-schema = { version = "58.1.0", optional = true }
parquet = { version = "58.1.0", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
uuid = { version = "1.29.3", features = ["v4"] }
tokio = { version = "1.53", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
