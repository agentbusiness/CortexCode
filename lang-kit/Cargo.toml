[package]
name = "cc-lang-kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "Shared kit of CortexCode's language plugins (lang@1) and skills plugins (skills@1): pack scaffolding over CPP/1, an LSP client with diagnostics settling, toolchain installers, skills and tree-sitter helpers."

# Standalone: every language plugin is its own workspace and depends on this crate by path.
[workspace]

[lib]
name = "cc_lang_kit"
path = "src/lib.rs"

[dependencies]
cc-protocol = { path = "../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
# data/skills/codes.toml (the diagnostic codes each skill covers).
toml = "0.9"
blake3 = "1.8"
url = "2.5"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4.46"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# Release downloads for `install` (HTTPS only, rustls).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "test-util"] }
tempfile = "3.27"
# Real grammars for the syntax helpers' tests (C++: preprocessor lines end with their newline).
tree-sitter-rust = "0.24"
tree-sitter-cpp = "0.23.4"
