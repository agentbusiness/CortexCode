[package]
name = "cx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "cx: the CortexCode command line for the long tail (tasks, board, agents, code graph, browser, jobs), talking to the frame over its WebSocket."

# Standalone workspace.
[workspace]

[lib]
name = "cx"
path = "src/lib.rs"

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt", "macros", "net", "time", "io-util", "io-std"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
